objective:
  primary_kpi: rank0_time_per_iter_ms
  secondary_kpis: [p2p_kernel_instances, exact_full_output]

benchmark:
  layer: component
  grade: publication
  variable_under_test: scheduler_path

workload:
  type: inference
  model: "toy BF16 pipeline: 8 forward and 8 backward bias-free Linear+ReLU layers"
  prompt_or_seq_len:
    p50: 2048
    p95: 2048
    max: 2048
  batch_shape:
    p50: [32, 2048, 4096]
    p95: [32, 2048, 4096]
    max: [32, 2048, 4096]
  constraints:
    - 2 pipeline stages on 2 NVIDIA B200 GPUs
    - 8 microbatches and 3 measured iterations after 5 warmup iterations
    - preserve every forward step, backward step, and P2P payload transfer
    - preserve the full [32, 2048, 4096] output from each rank
    - require exact full-output equality for candidate qualification
    - fixed weights and fixed seeded inputs with no optimizer update between logical iterations

slos:
  latency_ms:
    p50: null
    p95: null
    p99: null
  availability: null
  cost_budget: "none; bounded reuse of the existing 2-B200 validation host"

environment:
  hardware:
    gpu: ["NVIDIA B200", 2, "unknown in retained receipt"]
    cpu: "not recorded in retained receipt"
    ram_gb: null
    storage: "not material to timed worker interval"
    interconnect: ["GPU P2P; exact NVLink/NVSwitch topology not recorded"]
    topology: "two visible GPUs, CUDA_VISIBLE_DEVICES=0,1"
  software:
    os: "linux"
    kernel: "not recorded"
    driver: "580.173.02"
    cuda: "13.0"
    pytorch: "2.9.1+cu130"
    triton: "3.5.1"
    frameworks: []
    nccl: "2.27.7"
    container_orchestrator: "not recorded"
  data_pipeline: ["fixed seeded device input reused for each measured iteration"]

