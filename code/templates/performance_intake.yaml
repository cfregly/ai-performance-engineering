# Copy this file, fill it out, and keep it alongside the artifacts for the workload you are tuning.
# The goal is to tighten the loop between goals, baselines, and proof-of-benefit.

objective:
  primary_kpi: tokens_per_second            # or time_to_train_hours | mfu_pct | scaling_efficiency_pct | ttft_ms | p99_latency_ms | jitter_cv_pct | cost_per_token_usd | cost_per_request_usd
  secondary_kpis: [throughput_per_dollar, throughput_per_watt, SLA_attainment_%]

benchmark:
  layer: component                          # micro | component | end_to_end
  grade: publication                        # publication | realism
  variable_under_test: runtime_version      # hardware_generation | runtime_version | scheduler_path | batching_policy | concurrency_model

workload:
  type: inference                           # or training
  model: "<name/version, params, precision>"
  prompt_or_seq_len:
    p50: null
    p95: null
    max: null
  batch_shape:
    p50: null
    p95: null
    max: null                               # or specify a QPS profile for online traffic
  constraints: []                           # quality targets, formatting/grammar constraints, allowed accuracy deltas

slos:
  latency_ms:
    p50: null
    p95: null
    p99: null
  availability: null
  cost_budget: "<$ per day/week/month>"

environment:
  hardware:
    gpu: ["model", count, "memory_gb"]
    cpu: "model / cores"
    ram_gb: null
    storage: "<type/throughput>"
    interconnect: ["NVLink/NVSwitch", "NIC type & Gb/s"]
    topology: "e.g., NVSwitch fabric + host NICs"
  software:
    os: ""
    kernel: ""
    driver: ""
    cuda: ""
    pytorch: ""
    triton: ""
    frameworks: ["vLLM", "SGLang", "TensorRT-LLM"]
    nccl: ""
    container_orchestrator: ""
  data_pipeline: []                         # where inputs come from, caching, prefetching, pin-memory

current_baseline:
  time_to_train_hours: null
  mfu_pct: null
  scaling_efficiency_pct: null
  tokens_per_second: null
  ttft_ms: null
  p50_ms: null
  p99_ms: null
  jitter_cv_pct: null
  gpu_util_percent: null
  mem_bw_percent: null
  nic_gbps: null
  goodput_percent: null                     # useful GPU time / total step/request time
  cost_per_token_usd: null
  cost_per_request_usd: null

hot_path_model:
  path: "<module:function or benchmark target>"
  phase: steady_state                       # setup | warmup | steady_state | teardown | end_to_end
  invocation_frequency: per_request         # once | per_batch | per_request | per_token | per_rank | per_element
  invocations_per_primary_unit: null         # e.g. calls per request, token, or training step
  estimated_costs:
    bytes_read: null
    bytes_written: null
    host_device_bytes: null
    allocations_or_materializations: null
    kernel_launches: null
    synchronizations_or_locks: null
    api_process_or_rpc_crossings: null
    storage_or_network_operations: null
  operation_cost_source: ""                 # current profile/artifact preferred; published tables are intuition only
  expected_dominant_cost: ""
  best_case_primary_kpi_improvement_pct: null

evidence:
  baseline_artifact: ""
  profile_artifacts: []
  allocation_or_memory_profile: ""
  hardware_counter_artifacts: []
  static_review_findings: []                 # hypotheses only; do not report these as measured wins

candidate_optimizations: []                  # algorithm/work avoided | bulk_api | representation/locality | allocation/copy | sync/parallelism | generated_code

known_issues_or_hypotheses: []

risk_guardrails:
  correctness_tests: []                     # golden outputs, regressions to run
  change_windows: []                        # when it is safe to experiment
