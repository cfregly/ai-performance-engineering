    strict_repository_harness_required_for_speedup_claim: true
  matrix_value_study:
    frozen_implementation_selected_on_scaled_normal_only: true
    two_resident_rotated_buffer_sets: true
    natural_warmed_cache_no_explicit_flush: true
    windows_per_fill: 5
    balanced_interleaving: five_row_subset_of_six_treatment_Williams_design
    every_fill_has_five_distinct_ordinal_positions: true
    K_order_direction_counts: {random_before_clustered: 3, clustered_before_random: 2}
    observer_OFF_ON_pairs_per_fill: 8
    per_fill_short_sizing: true
    maximum_planned_observer_and_primary_GPU_active_minutes: 25
    phase_wall_time_budget_minutes: 30
    unsettled_aggregate_policy: suppress_latency_throughput_power_and_energy_summaries
    fills:
      scaled_normal:
        role: representative_reference
      uniform_rms_matched_to_scaled_normal:
        role: distribution_control_at_matched_expected_RMS
      uniform_minus1_plus1:
        role: documented_uniform_control_with_amplitude_confound
      k_order_random_balanced:
        role: low_entropy_ordering_control
      k_order_positive_then_negative:
        role: common_K_permutation_of_low_entropy_ordering_control
      zero_power_switching_calibration:
        role: low_switching_calibration_pending_executed_tensor_work_proof
    ordering_control_hard_gates:
      - exact_full_value_histograms
      - full_FP32_reference_bitwise_equality
      - identical_shapes_and_strides
      - matching_allocation_alignment_classes
      - full_actual_output_oracle_checks
      - final_actual_outputs_bitwise_equal_and_nonzero
    causal_limit: no_internal_switching_or_operand_accumulator_isolation_claim
  profiles:
    exact_post_settling_NVTX_launch: true
    nsys_kernel_and_launch_identity: required
    ncu_clock_control: none
    ncu_cache_control: none
    same_pass_GPC_clock_and_duration: required
    native_SM100_dense_BF16_tensor_work_metric: query_then_require_supported_metric
  copy_refresh:
    payload_bytes: 8589934592
    implementation: torch_CUDA_tensor_copy
    fresh_random_windows: 5
    exact_settling_ms: 3000
    minimum_timed_GPU_ms: 1000
    full_equality: true
    observer_OFF_ON_pairs: 8
    observer_and_primary_invocation_counts_sized_separately: true
    required_same_window_gates:
      - complete_query_cadence_including_boundaries
      - memory_clock_stability
      - power_stability
      - stable_application_memory_clock
      - performance_state_P0
      - selected_logical_GPU_identity
    graphics_clock_role: diagnostic_only
    copy_engine_identity_requires_matching_Nsys_trace: true
    unsettled_aggregate_policy: suppress_requested_byte_summary_and_nominal_fraction
    metric: effective_requested_read_plus_write_decimal_TB_per_s
    raw_physical_HBM_claim: false
  slot_budget_minutes:
    custody_and_source_readback: 5
    phase1_timeline: 7
    settled_library_screen: 18
    five_window_confirmation: 7
    matrix_value_peak_calibration: 30
    copy_refresh: 5
    exact_profiles: 13
    hashes_and_postflight: 5
