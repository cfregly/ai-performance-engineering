hot_path_model:
  path: labs.arithmetic_intensity_b200.optimization_benchmarks
  phase: steady_state
  invocation_frequency: per_iteration
  invocations_per_primary_unit: 1
  estimated_costs:
    bytes_read: workload_specific
    bytes_written: workload_specific
    host_device_bytes: 0
    allocations_or_materializations: 0
    kernel_launches: 1
    synchronizations_or_locks: 0
    api_process_or_rpc_crossings: 0
    storage_or_network_operations: 0
  operation_cost_source: prior_frozen_evidence_and_fresh_bounded_screen
  expected_dominant_cost: tensor_core_pipeline_for_gemm_and_device_memory_for_copy
  best_case_primary_kpi_improvement_pct: null

evidence:
  baseline_artifact: null
  baseline_artifact_note: prior_local_evidence_is_not_published_with_this_source
  profile_artifacts: []
  allocation_or_memory_profile: setup_is_excluded_from_timing
  hardware_counter_artifacts: []
  static_review_findings:
    - cuBLASLt exposes eight supported heuristics for the fixed 16384-cubed workload
    - native copy launch shape and cache-global load policy are bounded tuning variables

candidate_optimizations:
  - persistent_cublaslt_descriptors_workspace_and_exact_algorithm
  - supported_cublaslt_tile_stage_cluster_selection
  - cache_global_uint4_loads_with_four_way_grid_stride_unroll
  - copy_threads_and_blocks_per_sm_launch_tuning

known_issues_or_hypotheses:
  - short screens may overstate compute gains that disappear at the 1000 W sustained cap
  - requested copy bytes are a logical proxy and are not raw physical HBM traffic
  - virtualization makes all results strict_noncanonical_virtualized and publication ineligible

risk_guardrails:
  correctness_tests:
    - FP32_reference_of_exact_BF16_inputs_rtol_0.03_atol_0.03
    - full_268435456_element_GEMM_output_check_per_window
    - full_8589934592_byte_copy_equality_per_window
    - misaligned_and_overlapping_native_copy_arguments_rejected
  change_windows:
    - exclusive_flock_idle_preflight_foreign_process_monitor_and_watchdog
    - preserve_1000_W_power_and_existing_clock_configuration

nominal_gap_phase1:
  path: labs.arithmetic_intensity_b200.kernel_optimization_tool:diagnose-nominal-gap
  role: diagnostic_only
  primary_workload:
    shape: [16384, 16384, 16384]
    layout: row_major_nn
    input_dtype: bfloat16
    accumulator_dtype: float32
    beta: 0
    operand_distribution: seeded_scaled_normal_n_to_negative_one_quarter
    logical_flops_per_iteration: 8796093022208
    semantic_minimum_requested_bytes_per_iteration: 1610612736
  cost_model:
    expected_dominant_cost: sustained_tensor_core_issue_under_the_1000_W_cap
    exact_work_settling_ms_before_each_arm: 3000
    maximum_settle_to_timing_host_gap_ms: 20
    calibration_pairs: 8
    primary_windows: 3
    minimum_gpu_active_ms_per_timed_arm: 1000
    target_wall_time_minutes: 6
    hard_slot_limit_minutes: 10
  observer:
    repository_helpers:
      - core.profiling.gpu_telemetry.query_gpu_telemetry
      - core.utils.power_sampling.PowerSampler
    interval_ms: 100
    minimum_complete_queries_per_window: 8
    maximum_query_midpoint_gap_ms: 250
    leading_and_trailing_boundary_gap_limit_ms: 250
    maximum_gap_to_requested_interval_ratio: 2.5
    minimum_window_and_cadence_must_fit_required_queries: true
    paired_overhead_limit_pct: 0.5
    paired_overhead_acceptance: every_observed_pair_within_symmetric_limit
    bootstrap_interval_role: descriptive_only_not_equivalence_proof
    power_sampler_role: coarse_host_phase_energy_only
    power_sampler_identity: exact_NVML_UUID_matches_selected_CUDA_device
  required_outputs:
    - CUDA_event_TFLOP_per_s
    - graphics_and_application_clocks
    - power_temperature_and_throttle_bitmask
    - per_query_monotonic_intervals_and_latency
    - conservative_exact_work_settling_host_envelope
    - cadence_and_missed_sample_summary
    - realized_full_tensor_operand_min_max_mean_and_rms
    - full_output_FP32_oracle_check
    - per_window_declared_steady_state_gate
  claim_boundaries:
    - no_clock_scaled_nominal
    - no_accepted_optimization_claim
    - no_replacement_of_prior_primary_result
    - no_exact_host_to_CUDA_event_point_alignment
    - no_transferred_profiler_counters
    - unsettled_windows_retained_but_sustained_summary_and_nominal_fraction_suppressed
    - uniform_fill_changes_distribution_and_RMS_amplitude
    - RMS_matched_uniform_and_zero_are_optional_controls_not_primary_results

sustained_search_and_calibration:
