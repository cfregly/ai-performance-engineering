  path: labs.arithmetic_intensity_b200.sustained_optimization_tool
  runtime_contract:
    GPU: NVIDIA_B200_GPU0_only
    power_limit_w: 1000
    power_or_clock_changes: forbidden
    pytorch: 2.11.0+cu130_exact_readback_required
    strict_virtualized_evidence: true
    publication_eligible: false
  bounded_library_search:
    workspace_ceilings_mib: [0, 64, 512, 2048]
    max_heuristics_per_ceiling: 128
    candidate_cap: 24
    prior_required_signatures: 8
    CTA_strata_prioritized: [1, 2]
    balanced_ranking_pairs: 2
    exact_settling_ms_per_arm: 3000
    minimum_timed_GPU_ms_per_arm: 1000
    result_scope: descriptive_ranking_only
    not_exhaustive_algorithm_enumeration: true
  equivalent_work_confirmation:
    fresh_operand_windows: 5
    order: alternating_AB_BA
    same_operands_within_pair: true
    full_output_FP32_oracle: true
    every_window_steady_state_gate: true
    observer_OFF_ON_pairs: 8
    observer_and_primary_invocation_counts_sized_separately: true
    unsettled_aggregate_policy: suppress_baseline_candidate_and_paired_summaries
    promotion_threshold_pct: 5.0
