    - paired_candidate_vs_baseline_pct
    - dense_bf16_nominal_fraction
    - requested_copy_nominal_fraction

benchmark:
  layer: micro
  grade: realism
  variable_under_test: kernel_or_library_algorithm

workload:
  type: synthetic_kernel_microbenchmark
  model: dense_bf16_gemm_and_random_uint8_copy
  prompt_or_seq_len:
    p50: null
    p95: null
    max: null
  batch_shape:
    p50: null
    p95: null
    max: null
  constraints:
    - GPU0 only
    - dense BF16 without sparsity or TF32
    - FP32 GEMM accumulation and beta zero
    - row-major 16384x16384 NN GEMM
    - random 8 GiB uint8 copy payload
    - full-output correctness
    - setup and allocation excluded from CUDA-event timing

