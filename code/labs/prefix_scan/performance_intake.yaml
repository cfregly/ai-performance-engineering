objective:
  primary_kpi: kernel_latency_ms
benchmark:
  layer: micro
  grade: source study; target performance unmeasured
  variable_under_test: native versus hierarchical scan or CUDA look-back
workload:
  shape: 1048579 int32 values
environment:
  hardware: CUDA/Triton GPU required; CUDA toolkit for look-back
current_baseline:
  timing_artifact: null
  status: no accepted target-host timing
hot_path_model:
  path: code/labs/prefix_scan
  phase: CUDA scan and scratch-state reset
  invocation_frequency: one call per vector/matrix
  estimated_costs: Read/write int32 arrays plus tile totals and carries; look-back adds publication and
    state-reset traffic. No launch latency assumed.
  operation_cost_source: source-level operation counts; no hardware latency assumed
phases:
  setup: input generation, scratch allocation, optional compilation; grammar precompile time exposed
  warmup: owned by repository harness
  steady_state: actual kernel/policy/codec; full output retained
  verification: independent reference and complete output check after timing
evidence:
  correctness_test: tests/test_parallel_primitives.py
  gpu_execution: not executed on development Mac
  speedup_claim: false
