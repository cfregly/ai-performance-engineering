objective:
  primary_kpi: median_launch_latency_us
  secondary_kpis: [p95_launch_latency_us, effective_pflops]

benchmark:
  layer: component
  grade: realism
  variable_under_test: kernel_implementation

workload:
  type: gemm
  model: "8192x8192x8192 NVFP4 E2M1 GEMM, UE4M3 VEC16 scales, FP16 output"
  batch_shape:
    p50: [8192, 8192, 8192]
    p95: [8192, 8192, 8192]
    max: [8192, 8192, 8192]
  constraints:
    - identical packed input bytes and scale buffers for both arms
    - full FP16 output compared with rtol 0.002 and atol 0.5
    - exact SM100 B200 and CUDA 13.0 or newer
    - native K64 tensor-core arithmetic with no alternate-precision substitution

slos:
  latency_ms: {p50: null, p95: null, p99: null}
  availability: null
  cost_budget: null

environment:
  hardware:
    gpu: ["B200 SM100", 1, null]
    cpu: "recorded by harness provenance"
    ram_gb: null
    storage: null
    interconnect: ["single GPU"]
    topology: "single exact-SM100 device"
  software:
    os: "recorded by harness provenance"
    kernel: "recorded by harness provenance"
    driver: "recorded by harness provenance"
    cuda: "13.0 or newer. Extension compiled only for sm_100a"
    pytorch: "recorded by harness provenance"
    triton: "not used"
    frameworks: ["CUDA C++", "cuBLASLt", "PyTorch extension"]
    nccl: "not used"
    container_orchestrator: "recorded by harness provenance"
  data_pipeline:
    - caller seed is passed to the pinned upstream host quantizer during setup
    - packed E2M1 values and UE4M3 VEC16 scales remain device resident

