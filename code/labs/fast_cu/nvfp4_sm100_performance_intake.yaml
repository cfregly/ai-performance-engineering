evidence:
  baseline_artifact: "pending exact-SM100 harness run"
  profile_artifacts: []
  allocation_or_memory_profile: "setup-only allocations enforced by adapter structure"
  hardware_counter_artifacts: []
  static_review_findings:
    - "K64 arithmetic needs different operand descriptors and scale loading from K96"
    - "the port retains two-CTA GEMM, TMA queues, double accumulators, and wide stores"
    - "both cuBLASLt and fast.cu launch on the active PyTorch CUDA stream"

candidate_optimizations:
  - "K64 port of the r5 pipeline for B200"
  - "256-bit FP16 stores with identical cache hints to r5"

known_issues_or_hypotheses:
  - "B200 correctness and performance tests are pending"
  - "This native pair uses one resident operand set and does not reproduce the upstream rotating five-round headline protocol"

risk_guardrails:
  correctness_tests:
    - "full FP16 cuBLASLt-versus-fast.cu output comparison"
    - "same packed A/B/SFA/SFB bytes from the caller seed"
    - "independent host reference, partial tiles, poisoned output, guards, and determinism"
  change_windows:
    - "promote performance claims only after locked-clock repeated comparison plus NCU and NSYS evidence"
