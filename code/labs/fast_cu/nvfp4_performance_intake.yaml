    ram_gb: null
    storage: null
    interconnect: ["single GPU"]
    topology: "single exact-SM103 device"
  software:
    os: "recorded by harness provenance"
    kernel: "recorded by harness provenance"
    driver: "recorded by harness provenance"
    cuda: "13.1 or newer; extension compiled only for sm_103a"
    pytorch: "recorded by harness provenance"
    triton: "not used"
    frameworks: ["CUDA C++", "cuBLASLt", "PyTorch extension"]
    nccl: "not used"
    container_orchestrator: "recorded by harness provenance"
