name: Benchmark Validation

on:
  push:
    branches: [main, develop]
    paths:
      - "code/ch*/**"
      - "code/labs/**"
      - "code/core/**"
      - "code/cli/**"
      - "code/dashboard/**"
      - "code/tests/**"
      - "code/pyproject.toml"
      - "code/requirements_latest.txt"
      - "code/uv.lock"
      - "code/setup.sh"
      - "code/Makefile"
      - "code/examples/**"
      - "code/docs/autoresearch_campaigns.md"
      - "code/.github/workflows/**"
      - ".gitmodules"
      - ".github/workflows/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "code/ch*/**"
      - "code/labs/**"
      - "code/core/**"
      - "code/cli/**"
      - "code/dashboard/**"
      - "code/tests/**"
      - "code/pyproject.toml"
      - "code/requirements_latest.txt"
      - "code/uv.lock"
      - "code/setup.sh"
      - "code/Makefile"
      - "code/examples/**"
      - "code/docs/autoresearch_campaigns.md"
      - "code/.github/workflows/**"
      - ".gitmodules"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-validation-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: code

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements_latest.txt

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest==8.3.4 \
            pytest-cov==7.1.0 \
            coverage[toml]==7.15.2 \
            pyyaml==6.0.2 \
            pydantic==2.12.4 \
            typer==0.12.0 \
            click==8.1.7 \
            rich==13.7.0 \
            psutil==7.1.0 \
            numpy==2.1.2 \
            fastapi==0.121.3 \
            uvicorn==0.38.0 \
            httpx==0.28.1
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run core contract tests
        run: |
          pytest -q \
            tests/test_benchmark_metrics.py \
            tests/test_profiler_config.py \
            tests/test_benchmark_fn_sync_detection.py \
            tests/test_benchmark_linter.py \
            tests/test_tier1_suite.py \
            tests/test_tier1_history_restore.py \
            tests/test_promote_tier1_history.py \
            tests/test_update_history_index_cli.py \
            tests/test_benchmark_e2e_sweep.py \
            tests/test_run_manifest_provenance.py \
            tests/test_run_benchmarks_cuda_wrapper_regression.py \
            tests/test_environment_validation_enforcement.py \
            tests/test_audit_silent_fallbacks.py \
            tests/test_optimize.py \
            tests/test_llm_patch_promotion.py \
            tests/test_optimization_campaign.py \
            tests/test_optimization_opportunities.py \
            tests/test_campaign_evidence.py \
            tests/test_llm_patch_worker.py \
            tests/test_mcts_optimizer.py \
            tests/test_ch10_makefile_contract.py \
            tests/test_tma_multicast_tool.py \
            tests/test_dual_arch_make_contract.py \
            tests/test_repository_configuration.py \
            tests/test_setup_bootstrap.py \
            tests/test_dashboard_server.py \
            tests/test_ch19_dynamic_precision_pair.py \
            tests/test_validate_benchmark_pairs_tools.py::test_ch04_no_overlap_torchrun_specs_use_public_target_names \
            tests/test_validate_benchmark_pairs_tools.py::test_ch04_additional_torchrun_specs_build_without_side_effects \
            tests/test_validate_benchmark_pairs_tools.py::test_ch04_nvshmem_torchrun_specs_preserve_variant_contracts

      - name: Validate shell entrypoints
        run: |
          bash -n setup.sh
          bash -n core/scripts/install_cutlass.sh
          bash -n core/scripts/ci/run_compare_builds.sh
          bash -n ch03/numa_topology_script.sh
          bash -n ch03/cpu_gpu_numa_optimizations.sh

      - name: Audit silent fallbacks
        run: |
          python core/scripts/audit_silent_fallbacks.py \
            --fail-on-findings \
            --categories global_warning_filter stderr_reassignment stdout_reassignment stdio_dup2_hijack syntax_error read_error

      - name: Enforce repository-wide benchmark contracts
        run: python -m core.scripts.linting.check_benchmarks --include-unpaired --fail-on-warnings

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install static analysis tools
        working-directory: code
        run: python -m pip install ruff==0.8.4 mypy==1.18.2

      - name: Run repository-wide first-party Ruff correctness checks
        working-directory: code
        run: ruff check . --select E9,F63,F7,F82,B006,B023

      - name: Run blocking focused Ruff checks
        working-directory: code
        run: |
          ruff check \
            core/optimization/campaign.py \
            core/optimization/campaign_evidence.py \
            core/optimization/evidence_validation.py \
            core/harness/llm_patch_worker.py \
            core/optimization/search/mcts_optimizer.py \
            core/analysis/llm_patch_promotion.py \
            tests/test_optimization_campaign.py \
            tests/test_campaign_evidence.py \
            tests/test_llm_patch_worker.py \
            tests/test_mcts_optimizer.py \
            tests/test_llm_patch_promotion.py \
            tests/test_repository_configuration.py

      - name: Run blocking focused mypy checks
        working-directory: code
        run: mypy core/optimization/campaign.py core/analysis/llm_patch_promotion.py

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: code/dashboard/web/package-lock.json

      - name: Install dashboard dependencies
        working-directory: code/dashboard/web
        run: npm ci

      - name: Audit dashboard dependencies
        working-directory: code/dashboard/web
        run: npm audit --audit-level=moderate

      - name: Lint dashboard
        working-directory: code/dashboard/web
        run: npm run lint

      - name: Test dashboard
        working-directory: code/dashboard/web
        run: npm test -- --runInBand

      - name: Build dashboard
        working-directory: code/dashboard/web
        run: npm run build
