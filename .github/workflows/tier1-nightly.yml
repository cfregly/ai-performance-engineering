name: Tier-1 Nightly

on:
  workflow_dispatch:
    inputs:
      bootstrap_history:
        description: Establish the first canonical B200 history anchor
        required: false
        default: false
        type: boolean
      accept_history_anchor:
        description: Ratify this reviewed manual run as the new canonical history anchor
        required: false
        default: false
        type: boolean
      acceptance_note:
        description: Public review note required when accepting a new history anchor
        required: false
        default: ""
        type: string
  schedule:
    - cron: "15 3 * * *"

permissions:
  actions: read
  contents: read

defaults:
  run:
    working-directory: code
    shell: bash

jobs:
  tier1:
    name: Run canonical tier-1 suite
    # Apply node24-actions only to self-hosted runners at version 2.327.1 or newer.
    # The b200 label and GPU preflight keep canonical history on one hardware class.
    runs-on: [self-hosted, linux, x64, gpu, b200, node24-actions]
    timeout-minutes: 360
    concurrency:
      group: tier1-nightly-producer
      cancel-in-progress: false
      queue: max
    outputs:
      run_id: ${{ steps.compute_run_id.outputs.run_id }}
      artifact_suffix: ${{ steps.compute_run_id.outputs.artifact_suffix }}
      candidate_history_artifact_id: ${{ steps.upload_tier1_candidate_history.outputs.artifact-id }}
      evidence_artifact_id: ${{ steps.upload_tier1_evidence.outputs.artifact-id }}
      evidence_artifact_name: tier1-evidence-${{ steps.compute_run_id.outputs.artifact_suffix }}
      evidence_artifact_digest: ${{ steps.upload_tier1_evidence.outputs.artifact-digest }}
      evidence_identity_bound: ${{ steps.bind_evidence.outcome }}
    env:
      TIER1_EXPECTED_GPU_NAME: NVIDIA B200
      TIER1_ARTIFACT_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
      TIER1_ACCEPT_HISTORY_ANCHOR: ${{ inputs.accept_history_anchor || false }}
      TIER1_ACCEPTANCE_NOTE: ${{ inputs.acceptance_note || '' }}

    steps:
      - name: Compute run id
        id: compute_run_id
        working-directory: /
        run: |
          run_id="$(date -u +%Y%m%d_%H%M%S)_tier1_nightly_${GITHUB_SHA::8}"
          echo "RUN_ID=${run_id}" >> "$GITHUB_ENV"
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "artifact_suffix=${TIER1_ARTIFACT_SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Validate canonical request
        working-directory: /
        env:
          BOOTSTRAP_HISTORY: ${{ inputs.bootstrap_history || false }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Tier-1 canonical history may run only from refs/heads/main" >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" && "${TIER1_ACCEPT_HISTORY_ANCHOR}" == "true" ]]; then
            echo "Scheduled Tier-1 runs cannot accept a new history anchor" >&2
            exit 1
          fi
          if [[ "${TIER1_ACCEPT_HISTORY_ANCHOR}" == "true" && -z "${TIER1_ACCEPTANCE_NOTE//[[:space:]]/}" ]]; then
            echo "A public acceptance note is required" >&2
            exit 1
          fi
          if [[ "${TIER1_ACCEPT_HISTORY_ANCHOR}" != "true" && -n "${TIER1_ACCEPTANCE_NOTE//[[:space:]]/}" ]]; then
            echo "acceptance_note requires accept_history_anchor" >&2
            exit 1
          fi
          if [[ "${BOOTSTRAP_HISTORY}" == "true" && "${TIER1_ACCEPT_HISTORY_ANCHOR}" != "true" ]]; then
            echo "bootstrap_history requires protected anchor acceptance" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            code/requirements_latest.txt
            code/requirements_torch2141_linux_x86_64.txt
            code/vllm_source_build.json
            code/native_torch_extensions.json
            code/torch_dlpack_source_build.json
            code/scripts/build_torch_dlpack_wheel.py
            code/vendor/python-wheels/*.whl

      - name: Create isolated Python environment
        run: |
          TIER1_VENV="${RUNNER_TEMP}/tier1-python-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -e "${TIER1_VENV}" ]]; then
            echo "Tier-1 virtual environment path already exists: ${TIER1_VENV}" >&2
            exit 1
          fi
          python -m venv "${TIER1_VENV}"
          echo "${TIER1_VENV}/bin" >> "${GITHUB_PATH}"
          echo "VIRTUAL_ENV=${TIER1_VENV}" >> "${GITHUB_ENV}"

      - name: Select pinned Rust toolchain
        run: |
          command -v rustup
          rustup toolchain install 1.95.0 --profile minimal
          echo "RUSTUP_TOOLCHAIN=1.95.0" >> "${GITHUB_ENV}"
          RUSTUP_TOOLCHAIN=1.95.0 rustc --version
          RUSTUP_TOOLCHAIN=1.95.0 cargo --version

      - name: Restore latest Tier-1 history
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOOTSTRAP_HISTORY: ${{ inputs.bootstrap_history || false }}
        run: |
          bootstrap_args=()
          renewal_args=()
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${BOOTSTRAP_HISTORY}" == "true" ]]; then
            bootstrap_args+=(--allow-bootstrap)
          fi
          if [[ "${TIER1_ACCEPT_HISTORY_ANCHOR}" == "true" ]]; then
            renewal_args+=(--allow-anchor-renewal)
          fi
          python -m core.scripts.ci.restore_tier1_history \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow tier1-nightly.yml \
            --branch "${GITHUB_REF_NAME}" \
            --current-run-id "${GITHUB_RUN_ID}" \
            --destination artifacts/history/tier1 \
            "${bootstrap_args[@]}" \
            "${renewal_args[@]}"

      - name: Install Python dependencies
        run: |
          python -m pip install \
            --extra-index-url https://download.pytorch.org/whl/cu130 \
            --find-links vendor/python-wheels \
            --require-hashes \
            --no-deps \
            -r requirements_torch2141_linux_x86_64.txt
          python -m pip check

      - name: Validate native source-build isolation
        run: |
          command -v unshare
          unshare --net -- true
          CUDA_NVCC="$(readlink -f "$(command -v nvcc)")"
          CUDA_TOOLKIT_ROOT="$(dirname "$(dirname "${CUDA_NVCC}")")"
          test -x "${CUDA_TOOLKIT_ROOT}/bin/nvcc"
          test "$(readlink -f "${CUDA_TOOLKIT_ROOT}/bin/nvcc")" = "${CUDA_NVCC}"
          "${CUDA_NVCC}" --version | grep -F "release 13.0"
          echo "CUDA_HOME=${CUDA_TOOLKIT_ROOT}" >> "${GITHUB_ENV}"
          echo "CUDA_PATH=${CUDA_TOOLKIT_ROOT}" >> "${GITHUB_ENV}"
          echo "TORCH_CUDA_HOME=${CUDA_TOOLKIT_ROOT}" >> "${GITHUB_ENV}"
          echo "CUDACXX=${CUDA_NVCC}" >> "${GITHUB_ENV}"
          echo "CMAKE_CUDA_COMPILER=${CUDA_NVCC}" >> "${GITHUB_ENV}"

      - name: Build and install pinned Transformer Engine Torch binding
        env:
          CUDA_VISIBLE_DEVICES: ""
          TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
          NATIVE_EXTENSION_BUILD_ROOT: ${{ runner.temp }}/te-torch2141-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python scripts/build_torch_extensions.py \
            --package transformer-engine-torch \
            --output-dir "${NATIVE_EXTENSION_BUILD_ROOT}" \
            --cuda-arch-list 10.0 \
            --max-jobs 8 \
            --nvcc-threads 2
          TE_RECEIPT="${NATIVE_EXTENSION_BUILD_ROOT}/native-torch-extensions.manifest.json"
          TE_WHEEL="$(python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["packages"]["transformer-engine-torch"]["wheel"]["path"])' "${TE_RECEIPT}")"
          test -f "${TE_WHEEL}"
          python - "${TE_RECEIPT}" "${TE_WHEEL}" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          receipt = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          wheel_path = Path(sys.argv[2]).resolve()
          runtime = receipt["runtime"]
          isolation = runtime["network_isolation"]
          if isolation["mechanism"] != "linux-unshare-network-namespace":
              raise SystemExit(f"Unexpected native-build isolation: {isolation}")
          if isolation["preflight"] != "passed":
              raise SystemExit(f"Native-build isolation preflight failed: {isolation}")

          package = receipt["packages"]["transformer-engine-torch"]
          build = package["build"]
          if build["network_isolation"] != "linux-unshare-network-namespace":
              raise SystemExit(f"Native build was not network-isolated: {build}")
          toolkit = runtime["cuda_toolkit"]
          expected_environment = {
              "CMAKE_CUDA_COMPILER": toolkit["nvcc"],
              "CUDACXX": toolkit["nvcc"],
              "CUDA_HOME": toolkit["root"],
              "CUDA_PATH": toolkit["root"],
              "PIP_NO_INDEX": "1",
              "TORCH_CUDA_HOME": toolkit["root"],
          }
          actual_environment = {
              key: build["environment"].get(key) for key in expected_environment
          }
          if actual_environment != expected_environment:
              raise SystemExit(
                  "Native build did not bind the validated CUDA root and offline mode: "
                  f"expected {expected_environment}, got {actual_environment}"
              )
          forbidden_search_paths = {
              "CPATH",
              "CPLUS_INCLUDE_PATH",
              "C_INCLUDE_PATH",
              "LIBRARY_PATH",
              "LD_LIBRARY_PATH",
              "PYTHONPATH",
          }
          leaked = sorted(forbidden_search_paths & build["environment"].keys())
          if leaked:
              raise SystemExit(f"Native build retained inherited search paths: {leaked}")
          recorded_wheel = Path(package["wheel"]["path"]).resolve()
          if recorded_wheel != wheel_path:
              raise SystemExit(f"Native wheel path mismatch: {recorded_wheel} != {wheel_path}")
          with wheel_path.open("rb") as stream:
              actual_sha256 = hashlib.file_digest(stream, "sha256").hexdigest()
          if actual_sha256 != package["wheel"]["sha256"]:
              raise SystemExit("Native wheel SHA-256 does not match its build receipt")
          PY
          python -m pip install --no-deps "${TE_WHEEL}"
          python -m pip check
          python - <<'PY'
          from importlib import metadata

          assert metadata.version("transformer-engine") == "2.20.2"
          assert metadata.version("transformer-engine-cu13") == "2.20.2"
          assert metadata.version("transformer-engine-torch") == "2.20.2"
          PY

      - name: Build and install pinned vLLM source
        env:
          CUDA_VISIBLE_DEVICES: ""
          TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
          VLLM_BUILD_ROOT: ${{ runner.temp }}/vllm-torch2141-${{ github.run_id }}-${{ github.run_attempt }}
          PYTORCH_NVML_BASED_CUDA_CHECK: "1"
        run: |
          python scripts/build_vllm_for_torch.py \
            --output-dir "${VLLM_BUILD_ROOT}" \
            --cuda-arch-list 10.0 \
            --max-jobs 4 \
            --nvcc-threads 2
          VLLM_WHEEL="$(python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["wheel"]["path"])' "${VLLM_BUILD_ROOT}/vllm-source-wheel.manifest.json")"
          test -f "${VLLM_WHEEL}"
          python -m pip install --no-deps "${VLLM_WHEEL}"
          python -m pip check
          python - <<'PY'
          import os
          from importlib import metadata
          from pathlib import Path

          import torch
          import triton
          import vllm
          import vllm._C_stable_libtorch
          import vllm._moe_C_stable_libtorch

          expected = {
              "flashinfer-python": "0.7.2",
              "torch": "2.14.1+cu130",
              "torchao": "0.18.0+cu130",
              "torchaudio": "2.11.0+cu130",
              "torchtitan": "0.3.0",
              "torchvision": "0.29.1+cu130",
              "triton": "3.8.0",
              "vllm": "0.33.0.dev0+cu130.torch2141",
          }
          actual = {name: metadata.version(name) for name in expected}
          if actual != expected:
              raise SystemExit(f"Tier-1 dependency mismatch: expected {expected}, got {actual}")
          if torch.version.cuda != "13.0":
              raise SystemExit(f"Tier-1 requires torch CUDA 13.0, got {torch.version.cuda!r}")
          rust_frontend = Path(vllm.__file__).resolve().parent / "vllm-rs"
          if not rust_frontend.is_file() or not os.access(rust_frontend, os.X_OK):
              raise SystemExit(f"Tier-1 vLLM wheel lacks executable {rust_frontend}")
          print(f"torch={torch.__version__} triton={triton.__version__} vllm={vllm.__version__}")
          PY

      - name: Materialize and verify the validated CUTLASS source
        run: |
          bash core/scripts/install_cutlass.sh db1c288993354c88e551c40c19a8fb93a774a241
          python core/verification/verify_cutlass_setup.py

      - name: GPU preflight
        run: |
          nvidia-smi
          python - <<'PY'
          import os
          import subprocess

          expected = os.environ["TIER1_EXPECTED_GPU_NAME"]
          rows = subprocess.check_output(
              [
                  "nvidia-smi",
                  "--query-gpu=name,mig.mode.current",
                  "--format=csv,noheader,nounits",
              ],
              text=True,
          ).splitlines()
          devices = [tuple(part.strip() for part in row.split(",", 1)) for row in rows if row.strip()]
          if not devices or any(name != expected or mig_mode != "Disabled" for name, mig_mode in devices):
              raise SystemExit(
                  f"Tier-1 requires full {expected!r} GPUs with MIG disabled, found {devices or ['none']}"
              )

          output = subprocess.check_output(
              [
                  "nvidia-smi",
                  "--query-gpu=name,uuid,memory.total,driver_version,mig.mode.current",
                  "--format=csv,noheader",
              ],
              text=True,
          )
          print(output)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("## Tier-1 GPU Preflight\n\n")
              handle.write("```text\n")
              handle.write(output)
              handle.write("```\n")
          PY

      - name: Run bounded PyTorch stack B200 compatibility smoke
        timeout-minutes: 5
        run: |
          mkdir -p artifacts
          SMOKE_JSON="${RUNNER_TEMP}/b200-torch2141-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          set +e
          timeout --signal=TERM --kill-after=15s 270s \
            python -m core.scripts.b200_torch2141_smoke \
              --deadline-seconds 240 \
              --format json \
              > "${SMOKE_JSON}"
          smoke_status=$?
          set -e
          if [[ -f "${SMOKE_JSON}" ]]; then
            cp "${SMOKE_JSON}" artifacts/b200-torch2141-smoke.json
            cat artifacts/b200-torch2141-smoke.json
          fi
          exit "${smoke_status}"

      - name: Run verification tests on the attested GPU runner
        # Serialized by the existing tier1-nightly-producer concurrency group.
        # Skips in JUnit are missing hardware/feature coverage, never passes.
        env:
          AISP_RUN_FAST_CU_NVFP4_SM100_GPU_TEST: "1"
          AISP_RUN_TE_CUDA_TESTS: "1"
        run: |
          python -m pytest tests -q -ra -o timeout=600 --junitxml=artifacts/pytest-gpu.xml

      - name: Upload GPU test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-b200-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            code/artifacts/pytest-gpu.xml
            code/artifacts/b200-torch2141-smoke.json
          if-no-files-found: warn

      - name: Run canonical tier-1 suite
        id: run_tier1
        continue-on-error: ${{ env.TIER1_ACCEPT_HISTORY_ANCHOR == 'true' }}
        env:
          AISP_TIER1_EVIDENCE_ARTIFACT_NAME: tier1-evidence-${{ env.TIER1_ARTIFACT_SUFFIX }}
        run: |
          mkdir -p artifacts/history/tier1
          candidate_args=()
          if [[ "${TIER1_ACCEPT_HISTORY_ANCHOR}" == "true" ]]; then
            candidate_args+=(--history-anchor-candidate)
          fi
          python -m cli.aisp bench run-tier1 \
            --single-gpu \
            --profile minimal \
            --run-id "${RUN_ID}" \
            --history-root artifacts/history/tier1 \
            "${candidate_args[@]}" | tee /tmp/tier1_run.json

      - name: Bind immutable Tier-1 evidence identity
        id: bind_evidence
        if: ${{ always() && steps.run_tier1.outcome != 'skipped' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run_id = os.environ["RUN_ID"]
          expected_commit = os.environ["GITHUB_SHA"].lower()
          summary_path = Path("artifacts/history/tier1") / run_id / "summary.json"
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          if not isinstance(summary, dict) or summary.get("run_id") != run_id:
              raise SystemExit("Tier-1 summary identity is invalid")
          if (
              summary.get("source_git_commit") not in (None, expected_commit)
              or summary.get("source_manifest_git_commit") not in (None, expected_commit)
              or summary.get("source_git_dirty") not in (None, False)
          ):
              raise SystemExit("Tier-1 summary provenance does not match the checkout")
          evidence_root = Path("artifacts/runs").resolve()
          for key in ("source_manifest_json", "source_result_json"):
              reference = summary.get(key)
              if not isinstance(reference, str):
                  raise SystemExit("Tier-1 evidence reference is invalid")
              relative = Path(reference)
              if relative.is_absolute() or not relative.parts or relative.parts[0] != run_id:
                  raise SystemExit("Tier-1 evidence reference is not bound to the run")
              path = (evidence_root / relative).resolve()
              try:
                  path.relative_to(evidence_root)
              except ValueError as exc:
                  raise SystemExit("Tier-1 evidence reference escapes its artifact") from exc
              payload = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(payload, dict) or payload.get("run_id") not in (None, run_id):
                  raise SystemExit("Tier-1 evidence payload identity is invalid")
              payload["run_id"] = run_id
              if key == "source_manifest_json":
                  manifest_git = payload.get("git")
                  if manifest_git is None:
                      manifests = payload.get("manifests")
                      if not isinstance(manifests, list) or not manifests:
                          raise SystemExit("Tier-1 manifest provenance is missing")
                      nested_git = []
                      for record in manifests:
                          if not isinstance(record, dict) or not isinstance(record.get("manifest"), dict):
                              raise SystemExit("Tier-1 manifest provenance is malformed")
                          git = record["manifest"].get("git")
                          if not isinstance(git, dict):
                              raise SystemExit("Tier-1 manifest provenance is malformed")
                          nested_git.append(git)
                      if any(
                          not isinstance(git.get("commit"), str)
                          or git["commit"].lower() != expected_commit
                          or git.get("dirty") is not False
                          for git in nested_git
                      ):
                          raise SystemExit("Tier-1 manifest provenance does not match the checkout")
                      manifest_git = {"commit": expected_commit, "dirty": False}
                      payload["git"] = manifest_git
                  if (
                      not isinstance(manifest_git, dict)
                      or not isinstance(manifest_git.get("commit"), str)
                      or manifest_git["commit"].lower() != expected_commit
                      or manifest_git.get("dirty") is not False
                  ):
                      raise SystemExit("Tier-1 manifest provenance does not match the checkout")
              path.write_text(json.dumps(payload, indent=2, allow_nan=False), encoding="utf-8")
          summary["source_git_commit"] = expected_commit
          summary["source_manifest_git_commit"] = expected_commit
          summary["source_git_dirty"] = False
          summary_path.write_text(
              json.dumps(summary, indent=2, allow_nan=False),
              encoding="utf-8",
          )
          PY

      - name: Summarize tier-1 results
        if: always()
        working-directory: /
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run_id = os.environ["RUN_ID"]
          history_root = Path(os.environ["GITHUB_WORKSPACE"]) / "code" / "artifacts/history/tier1"
          run_dir = history_root / run_id
          summary_path = run_dir / "summary.json"
          regression_path = run_dir / "regression_summary.md"
          step_summary = Path(os.environ["GITHUB_STEP_SUMMARY"])

          lines = ["## Tier-1 Suite Result", ""]
          lines.append(f"- Run id: `{run_id}`")
          lines.append("- History root: `artifacts/history/tier1`")
          if summary_path.exists():
              payload = json.loads(summary_path.read_text(encoding="utf-8"))
              summary = payload.get("summary", {})
              lines.append(f"- Targets: `{summary.get('target_count', 0)}`")
              lines.append(f"- Succeeded: `{summary.get('succeeded', 0)}`")
              lines.append(f"- Failed: `{summary.get('failed', 0)}`")
              lines.append(f"- Geomean speedup: `{float(summary.get('geomean_speedup', 0.0)):.3f}x`")
              lines.append(f"- Max speedup: `{float(summary.get('max_speedup', 0.0)):.3f}x`")
          else:
              lines.append("- `summary.json` was not produced.")
          lines.append("")
          if regression_path.exists():
              lines.extend(["### Regression Summary", "", regression_path.read_text(encoding="utf-8")])
          with step_summary.open("a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Upload Tier-1 evidence artifact
        if: ${{ always() && steps.run_tier1.outcome != 'skipped' }}
        id: upload_tier1_evidence
        uses: actions/upload-artifact@v7
        with:
          name: tier1-evidence-${{ env.TIER1_ARTIFACT_SUFFIX }}
          path: |
            code/artifacts/runs/${{ env.RUN_ID }}
            code/artifacts/runs/${{ env.RUN_ID }}__recheck__*
          if-no-files-found: error
          retention-days: 90

      - name: Upload Tier-1 candidate history artifact
        if: ${{ always() && steps.run_tier1.outcome != 'skipped' && steps.upload_tier1_evidence.outcome == 'success' }}
        id: upload_tier1_candidate_history
        uses: actions/upload-artifact@v7
        with:
          name: tier1-candidate-history-${{ env.TIER1_ARTIFACT_SUFFIX }}
          path: code/artifacts/history/tier1
          if-no-files-found: error
          retention-days: 90

  publish-history:
    name: Publish Tier-1 evidence history
    needs: tier1
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || !inputs.accept_history_anchor) && needs.tier1.outputs.candidate_history_artifact_id != '' && needs.tier1.outputs.evidence_identity_bound == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: tier1-history-publication
      cancel-in-progress: false
      queue: max
    env:
      TIER1_ARTIFACT_SUFFIX: ${{ needs.tier1.outputs.artifact_suffix }}
      TIER1_CANDIDATE_RUN_ID: ${{ needs.tier1.outputs.run_id }}
      TIER1_CANDIDATE_HISTORY_ARTIFACT_ID: ${{ needs.tier1.outputs.candidate_history_artifact_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install history dependency
        run: python -m pip install pyyaml==6.0.2

      - name: Download immutable Tier-1 candidate history
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ env.TIER1_CANDIDATE_HISTORY_ARTIFACT_ID }}
          merge-multiple: true
          path: /tmp/tier1-candidate

      - name: Restore live Tier-1 canonical history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m core.scripts.ci.restore_tier1_history \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow tier1-nightly.yml \
            --branch "${GITHUB_REF_NAME}" \
            --current-run-id "${GITHUB_RUN_ID}" \
            --destination /tmp/tier1-live

      - name: Merge immutable Tier-1 evidence row
        run: |
          python -m core.scripts.benchmarks.merge_tier1_history \
            --candidate-history-root /tmp/tier1-candidate \
            --canonical-history-root /tmp/tier1-live \
            --output-history-root /tmp/tier1-published \
            --run-id "${TIER1_CANDIDATE_RUN_ID}"

      - name: Upload Tier-1 history artifact
        uses: actions/upload-artifact@v7
        with:
          name: tier1-history-${{ env.TIER1_ARTIFACT_SUFFIX }}
          path: /tmp/tier1-published
          if-no-files-found: error
          retention-days: 90

  authorize-history-anchor:
    name: Authorize reviewed Tier-1 history anchor
    needs: tier1
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.accept_history_anchor && needs.tier1.result == 'success' && needs.tier1.outputs.candidate_history_artifact_id != '' }}
    runs-on: ubuntu-latest
    environment: tier1-canonical-acceptance
    steps:
      - name: Record protected approval
        working-directory: /
        run: echo "Protected Tier-1 history promotion approved"

  promote-history-anchor:
    name: Ratify reviewed Tier-1 history anchor
    needs: [tier1, authorize-history-anchor]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.accept_history_anchor && needs.tier1.result == 'success' && needs['authorize-history-anchor'].result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: tier1-history-publication
      cancel-in-progress: false
      queue: max
    env:
      TIER1_ARTIFACT_SUFFIX: ${{ needs.tier1.outputs.artifact_suffix }}
      TIER1_CANDIDATE_RUN_ID: ${{ needs.tier1.outputs.run_id }}
      TIER1_CANDIDATE_HISTORY_ARTIFACT_ID: ${{ needs.tier1.outputs.candidate_history_artifact_id }}
      TIER1_ACCEPTANCE_NOTE: ${{ inputs.acceptance_note }}
      TIER1_EVIDENCE_ARTIFACT_ID: ${{ needs.tier1.outputs.evidence_artifact_id }}
      TIER1_EVIDENCE_ARTIFACT_NAME: ${{ needs.tier1.outputs.evidence_artifact_name }}
      TIER1_EVIDENCE_ARTIFACT_DIGEST: ${{ needs.tier1.outputs.evidence_artifact_digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install promotion dependency
        run: python -m pip install pyyaml==6.0.2

      - name: Download immutable Tier-1 candidate history
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ env.TIER1_CANDIDATE_HISTORY_ARTIFACT_ID }}
          merge-multiple: true
          path: /tmp/tier1-candidate

      - name: Download immutable Tier-1 benchmark evidence
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ env.TIER1_EVIDENCE_ARTIFACT_ID }}
          merge-multiple: true
          path: /tmp/tier1-evidence

      - name: Restore live Tier-1 canonical history
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOOTSTRAP_HISTORY: ${{ inputs.bootstrap_history || false }}
        run: |
          bootstrap_args=()
          if [[ "${BOOTSTRAP_HISTORY}" == "true" ]]; then
            bootstrap_args+=(--allow-bootstrap)
          fi
          python -m core.scripts.ci.restore_tier1_history \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow tier1-nightly.yml \
            --branch "${GITHUB_REF_NAME}" \
            --current-run-id "${GITHUB_RUN_ID}" \
            --destination /tmp/tier1-live \
            --allow-anchor-renewal \
            "${bootstrap_args[@]}"

      - name: Ratify immutable Tier-1 candidate
        env:
          BOOTSTRAP_HISTORY: ${{ inputs.bootstrap_history || false }}
        run: |
          bootstrap_args=()
          if [[ "${BOOTSTRAP_HISTORY}" == "true" ]]; then
            bootstrap_args+=(--allow-bootstrap)
          fi
          python -m core.scripts.benchmarks.promote_tier1_history \
            --history-root /tmp/tier1-candidate \
            --canonical-history-root /tmp/tier1-live \
            --output-history-root /tmp/tier1-ratified \
            --evidence-root /tmp/tier1-evidence \
            --suite-config configs/benchmark_suites/tier1.yaml \
            --run-id "${TIER1_CANDIDATE_RUN_ID}" \
            --requester "${GITHUB_ACTOR}" \
            --note "${TIER1_ACCEPTANCE_NOTE}" \
            --workflow-run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --expected-git-commit "${GITHUB_SHA}" \
            --expected-evidence-artifact "${TIER1_EVIDENCE_ARTIFACT_NAME}" \
            --expected-evidence-digest "${TIER1_EVIDENCE_ARTIFACT_DIGEST}" \
            "${bootstrap_args[@]}"

      - name: Upload ratified Tier-1 history artifact
        uses: actions/upload-artifact@v7
        with:
          name: tier1-history-${{ env.TIER1_ARTIFACT_SUFFIX }}
          path: /tmp/tier1-ratified
          if-no-files-found: error
          retention-days: 90
