<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="100%" height="100%" fill="#FBFBF8"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="context-stroke" stroke-width="2"/></marker>
<pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M-4 18 L18 -4 M8 26 L26 8" stroke="#E87823" stroke-width="2" opacity=".35"/></pattern></defs>
<text x="85" y="93" font-family="Bradley Hand" font-size="72" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="85" dy="0">Are legal IDs ready early?</tspan>
</text>
<text x="89" y="154" font-family="Arial, Helvetica, sans-serif" font-size="43" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="89" dy="0">How to spot a smaller projection</tspan>
</text>
<path d="M89 174.0 Q480 168.0 1080 176.0" fill="none" stroke="#202326" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<ellipse cx="269" cy="340" rx="55" ry="53.35" fill="#FBFBF8" stroke="#3478BA" stroke-width="4"/>
<text x="269" y="360" font-family="Arial, Helvetica, sans-serif" font-size="55" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="269" dy="0">1</tspan>
</text>
<path d="M350 340 Q439.0 338.0 524 340" fill="none" stroke="#202326" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="269" y="472" font-family="Bradley Hand" font-size="49" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="269" dy="0">Find the boundary</tspan>
</text>
<text x="269" y="550" font-family="Arial, Helvetica, sans-serif" font-size="42" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="269" dy="0">Are legal IDs known</tspan>
<tspan x="269" dy="50.4">before the output head?</tspan>
</text>
<ellipse cx="784" cy="340" rx="55" ry="53.35" fill="#FBFBF8" stroke="#3478BA" stroke-width="4"/>
<text x="784" y="360" font-family="Arial, Helvetica, sans-serif" font-size="55" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="784" dy="0">2</tspan>
</text>
<path d="M865 340 Q954.0 338.0 1039 340" fill="none" stroke="#202326" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="784" y="472" font-family="Bradley Hand" font-size="49" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="784" dy="0">Move the selection</tspan>
</text>
<text x="784" y="550" font-family="Arial, Helvetica, sans-serif" font-size="42" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="784" dy="0">Gather legal rows</tspan>
<tspan x="784" dy="50.4">before the multiply</tspan>
</text>
<ellipse cx="1299" cy="340" rx="55" ry="53.35" fill="#FBFBF8" stroke="#E87823" stroke-width="4"/>
<text x="1299" y="360" font-family="Arial, Helvetica, sans-serif" font-size="55" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="1299" dy="0">3</tspan>
</text>
<text x="1299" y="472" font-family="Bradley Hand" font-size="49" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="1299" dy="0">Time the whole path</tspan>
</text>
<text x="1299" y="550" font-family="Arial, Helvetica, sans-serif" font-size="42" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="1299" dy="0">Gather + projection</tspan>
<tspan x="1299" dy="50.4">+ legal argmax</tspan>
</text>
<path d="M110 690 Q800 675 1495 690" fill="none" stroke="#202326" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="800" y="759" font-family="Arial, Helvetica, sans-serif" font-size="48" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="800" dy="0">Changing sets: include each gather</tspan>
</text>
<text x="89" y="865.0" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="89" dy="0">Static sets: report one-time setup separately</tspan>
</text>
</svg>