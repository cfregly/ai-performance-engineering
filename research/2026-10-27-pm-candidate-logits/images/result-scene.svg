ight="36" fill="#E87823"/><line x1="84" y1="1100" x2="1116" y2="1100" stroke="#202326" stroke-width="2"/><line x1="84.0" y1="1100" x2="84.0" y2="1109" stroke="#202326" stroke-width="2"/><text x="84.0" y="1154" font-family="Inter" font-size="48" font-weight="400" fill="#202326" text-anchor="start">0</text><line x1="428.0" y1="1100" x2="428.0" y2="1109" stroke="#202326" stroke-width="2"/><text x="428.0" y="1154" font-family="Inter" font-size="48" font-weight="400" fill="#202326" text-anchor="middle">2</text><line x1="772.0" y1="1100" x2="772.0" y2="1109" stroke="#202326" stroke-width="2"/><text x="772.0" y="1154" font-family="Inter" font-size="48" font-weight="400" fill="#202326" text-anchor="middle">4</text><line x1="1116.0" y1="1100" x2="1116.0" y2="1109" stroke="#202326" stroke-width="2"/><text x="1116.0" y="1154" font-family="Inter" font-size="48" font-weight="400" fill="#202326" text-anchor="end">6 ms</text><text x="84" y="1220" font-family="Inter" font-size="48" font-weight="400" fill="#202326" text-anchor="start">Synthetic strict FP32 · B200</text><text x="84" y="1276" font-family="Inter" font-size="48" font-weight="400" fill="#202326" text-anchor="start">64 allowed tokens shared by batch</text><text x="84" y="1332" font-family="Inter" font-size="48" font-weight="400" fill="#202326" text-anchor="start">New set each step · weight gather included</text><text x="84" y="1388" font-family="Inter" font-size="48" font-weight="500" fill="#202326" text-anchor="start">Whole-model gains unmeasured</text>
