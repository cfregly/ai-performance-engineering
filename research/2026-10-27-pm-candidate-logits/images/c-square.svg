<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
<rect width="100%" height="100%" fill="#FBFBF8"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="context-stroke" stroke-width="2"/></marker></defs>
<text x="48" y="82.0" font-family="Inter" font-size="60" font-weight="400" font-style="normal" fill="#202326" text-anchor="start">Know which tokens are allowed</text>
<text x="48" y="149.2" font-family="Inter" font-size="60" font-weight="400" font-style="normal" fill="#202326" text-anchor="start">before scoring?</text>
<text x="48" y="219.2" font-family="Inter" font-size="36" font-weight="400" font-style="normal" fill="#202326" text-anchor="start">Find the point where selection can move earlier</text>
<circle cx="115" cy="385" r="42" fill="none" stroke="#E87823" stroke-width="3"/>
<text x="115" y="400.0" font-family="Inter" font-size="42" font-weight="400" font-style="normal" fill="#202326" text-anchor="middle">1</text>
<text x="220" y="377.0" font-family="Inter" font-size="42" font-weight="400" font-style="normal" fill="#202326" text-anchor="start">Identify allowed</text>
<text x="220" y="427.4" font-family="Inter" font-size="42" font-weight="400" font-style="normal" fill="#202326" text-anchor="start">tokens</text>
<line x1="115" y1="442" x2="115" y2="505" stroke="#E87823" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="115" cy="570" r="42" fill="none" stroke="#E87823" stroke-width="3"/>
<text x="115" y="585.0" font-family="Inter" font-size="42" font-weight="400" font-style="normal" fill="#202326" text-anchor="middle">2</text>
<text x="220" y="562.0" font-family="Inter" font-size="42" font-weight="400" font-style="normal" fill="#202326" text-anchor="start">Select their</text>
<text x="220" y="612.4" font-family="Inter" font-size="42" font-weight="400" font-style="normal" fill="#202326" text-anchor="start">weights</text>
<line x1="115" y1="627" x2="115" y2="690" stroke="#E87823" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="115" cy="755" r="42" fill="none" stroke="#E87823" stroke-width="3"/>
<text x="115" y="770.0" font-family="Inter" font-size="42" font-weight="400" font-style="normal" fill="#202326" text-anchor="middle">3</text>
<text x="220" y="747.0" font-family="Inter" font-size="42" font-weight="400" font-style="normal" fill="#202326" text-anchor="start">Measure gathering</text>
<text x="220" y="797.4" font-family="Inter" font-size="42" font-weight="400" font-style="normal" fill="#202326" text-anchor="start">+ scoring</text>
<text x="48" y="925.8" font-family="Inter" font-size="36" font-weight="400" font-style="normal" fill="#202326" text-anchor="start">Measure gathering, scoring and choosing the</text>
<text x="48" y="967.1999999999999" font-family="Inter" font-size="36" font-weight="400" font-style="normal" fill="#202326" text-anchor="start">highest-scoring allowed token</text>
<text x="48" y="1008.5999999999999" font-family="Inter" font-size="36" font-weight="400" font-style="normal" fill="#202326" text-anchor="start">Changing sets: gather each time</text>
<text x="48" y="1050.0" font-family="Inter" font-size="36" font-weight="400" font-style="normal" fill="#202326" text-anchor="start">Static sets: report setup separately</text>
