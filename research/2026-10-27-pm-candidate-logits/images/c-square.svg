<ellipse cx="118" cy="377" rx="42" ry="40.74" fill="#FBFBF8" stroke="#3478BA" stroke-width="4"/>
<text x="118" y="393" font-family="Arial, Helvetica, sans-serif" font-size="43" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="118" dy="0">1</tspan>
</text>
<text x="205" y="364" font-family="Bradley Hand" font-size="45" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="205" dy="0">Find the boundary</tspan>
</text>
<text x="205" y="421" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="205" dy="0">Are legal IDs known</tspan>
<tspan x="205" dy="42.0">before the output head?</tspan>
</text>
