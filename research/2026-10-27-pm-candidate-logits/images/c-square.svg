<ellipse cx="118" cy="579" rx="42" ry="40.74" fill="#FBFBF8" stroke="#3478BA" stroke-width="4"/>
<text x="118" y="595" font-family="Arial, Helvetica, sans-serif" font-size="43" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="118" dy="0">2</tspan>
</text>
<text x="205" y="566" font-family="Bradley Hand" font-size="45" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="205" dy="0">Move the selection</tspan>
</text>
<text x="205" y="623" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="205" dy="0">Gather legal rows</tspan>
