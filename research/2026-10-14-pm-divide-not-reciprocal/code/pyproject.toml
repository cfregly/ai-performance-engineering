[project]
name = "divide-not-reciprocal"
version = "0.1.0"
description = "A maintained division-by-six numerical-contract lab: exact census predictions, CUDA/Triton checks and optional component timing."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gpu = []  # Use an already prepared CUDA/PyTorch/Triton environment; see README. No dependency installation is performed by the runner.

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/divide_not_reciprocal"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
