<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img"><title>Placement B: pair replicas within each rack</title><desc>Rack 0 has stages 0 and 1 of both replicas; rack 1 has stages 2 and 3 of both replicas. Data-parallel pairs stay inside a rack. The stage 1 to stage 2 pipeline boundary crosses racks for both replicas.</desc><rect width="1200" height="1200" fill="#FBFBF8" /><text x="600" y="100" font-family="Inter" font-size="54" font-weight="600" text-anchor="middle" fill="#202326">Pair replicas within each rack</text><defs>
