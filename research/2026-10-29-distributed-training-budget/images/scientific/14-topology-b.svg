<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title description">
<title id="title">Pair stages inside racks</title>
<desc id="description">Placement B has stages 0 and 1 of both replicas in rack 0 and stages 2 and 3 in rack 1. The two thick blue P1 to P2 pipeline hops cross racks. Thin blue hops and orange data-parallel pairs stay inside a rack.</desc>
