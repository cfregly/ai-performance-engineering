<text x="220" y="288" font-family="Inter" font-size="64" font-weight="600" text-anchor="middle" fill="#202326">P0</text>
<polyline points="220,320 220,390" fill="none" stroke="#3478BA" stroke-width="4" stroke-linejoin="miter" marker-end="url(#arrow-blue)"/>
<rect x="60" y="390" width="320" height="110" fill="#FBFBF8" stroke="#202326" stroke-width="3"/>
<text x="220" y="468" font-family="Inter" font-size="64" font-weight="600" text-anchor="middle" fill="#202326">P1</text>
<polyline points="220,500 220,570" fill="none" stroke="#3478BA" stroke-width="4" stroke-linejoin="miter" marker-end="url(#arrow-blue)"/>
<rect x="60" y="570" width="320" height="110" fill="#FBFBF8" stroke="#202326" stroke-width="3"/>
<text x="220" y="648" font-family="Inter" font-size="64" font-weight="600" text-anchor="middle" fill="#202326">P2</text>
