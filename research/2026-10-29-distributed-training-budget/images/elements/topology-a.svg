<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
<title id="title">Data replicas in separate racks</title>
<desc id="desc">Eight nodes, four in each rack. One pipeline stage occupies each eight-GPU node. Every corresponding-stage data-parallel pair crosses racks.</desc>
<defs>
<marker id="arrow-ink" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 5 L 1 9" fill="none" stroke="#202326" stroke-width="3"/></marker>
<marker id="arrow-blue" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 5 L 1 9" fill="none" stroke="#3478BA" stroke-width="3"/></marker>
<marker id="arrow-orange" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 5 L 1 9" fill="none" stroke="#E87823" stroke-width="3"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="1000" fill="#FBFBF8"/>
<rect x="30" y="40" width="380" height="830" fill="#FBFBF8" stroke="#202326" stroke-width="3"/>
<text x="220" y="105" font-family="Inter" font-size="60" font-weight="600" text-anchor="middle" fill="#202326">Rack 0</text>
<text x="220" y="170" font-family="Inter" font-size="60" font-weight="600" text-anchor="middle" fill="#202326">R0</text>
