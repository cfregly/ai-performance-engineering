<text x="780" y="105" font-family="Inter" font-size="60" font-weight="600" text-anchor="middle" fill="#202326">Rack 1</text>
<text x="780" y="170" font-family="Inter" font-size="60" font-weight="600" text-anchor="middle" fill="#202326">R1</text>
