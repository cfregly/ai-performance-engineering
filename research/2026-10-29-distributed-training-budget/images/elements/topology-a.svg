<polyline points="50,935 110,935" fill="none" stroke="#3478BA" stroke-width="4" stroke-linejoin="miter" marker-end="url(#arrow-blue)"/>
<text x="130" y="951" font-family="Inter" font-size="48" font-weight="400" text-anchor="start" fill="#3478BA">PP</text>
