<polyline points="450,810 550,810" fill="none" stroke="#3478BA" stroke-width="4" stroke-linejoin="miter" marker-end="url(#arrow-blue)"/>
<polyline points="710,810 790,810" fill="none" stroke="#3478BA" stroke-width="4" stroke-linejoin="miter" marker-end="url(#arrow-blue)"/>
<polyline points="50,1020 110,1020" fill="none" stroke="#3478BA" stroke-width="4" stroke-linejoin="miter" marker-end="url(#arrow-blue)"/>
<text x="130" y="1036" font-family="Inter" font-size="48" font-weight="400" text-anchor="start" fill="#3478BA">PP</text>
<polyline points="300,1020 360,1020" fill="none" stroke="#E87823" stroke-width="4" stroke-linejoin="miter" marker-end="url(#arrow-orange)" marker-start="url(#arrow-orange)"/>
<text x="380" y="1036" font-family="Inter" font-size="48" font-weight="400" text-anchor="start" fill="#E87823">DP</text>
<text x="575" y="1036" font-family="Inter" font-size="48" font-weight="400" text-anchor="start" fill="#202326">8 GPUs/node</text>
</svg>
