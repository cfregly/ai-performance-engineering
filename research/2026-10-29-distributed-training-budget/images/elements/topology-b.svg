<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1100" viewBox="0 0 1000 1100" role="img" aria-labelledby="title desc">
<title id="title">Corresponding stages share a rack</title>
<desc id="desc">Rack 0 has stages 0 and 1 of both replicas; rack 1 has stages 2 and 3 of both replicas. Data-parallel pairs stay inside a rack. The stage 1 to stage 2 pipeline boundary crosses racks for both replicas.</desc>
<defs>
<marker id="arrow-ink" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 5 L 1 9" fill="none" stroke="#202326" stroke-width="3"/></marker>
<marker id="arrow-blue" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 5 L 1 9" fill="none" stroke="#3478BA" stroke-width="3"/></marker>
<marker id="arrow-orange" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 5 L 1 9" fill="none" stroke="#E87823" stroke-width="3"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="1100" fill="#FBFBF8"/>
<rect x="30" y="40" width="440" height="920" fill="#FBFBF8" stroke="#202326" stroke-width="3"/>
<text x="250" y="120" font-family="Inter" font-size="60" font-weight="600" text-anchor="middle" fill="#202326">Rack 0</text>
<text x="250" y="220" font-family="Inter" font-size="60" font-weight="600" text-anchor="middle" fill="#202326">R0</text>
<text x="250" y="680" font-family="Inter" font-size="60" font-weight="600" text-anchor="middle" fill="#202326">R1</text>
<rect x="50" y="280" width="160" height="140" fill="#FBFBF8" stroke="#202326" stroke-width="3"/>
<text x="130" y="372" font-family="Inter" font-size="64" font-weight="600" text-anchor="middle" fill="#202326">P0</text>
<rect x="290" y="280" width="160" height="140" fill="#FBFBF8" stroke="#202326" stroke-width="3"/>
<text x="370" y="372" font-family="Inter" font-size="64" font-weight="600" text-anchor="middle" fill="#202326">P1</text>
<rect x="50" y="740" width="160" height="140" fill="#FBFBF8" stroke="#202326" stroke-width="3"/>
<text x="130" y="832" font-family="Inter" font-size="64" font-weight="600" text-anchor="middle" fill="#202326">P0</text>
<rect x="290" y="740" width="160" height="140" fill="#FBFBF8" stroke="#202326" stroke-width="3"/>
<text x="370" y="832" font-family="Inter" font-size="64" font-weight="600" text-anchor="middle" fill="#202326">P1</text>
