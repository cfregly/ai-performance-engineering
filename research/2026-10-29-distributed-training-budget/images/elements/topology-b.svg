<text x="630" y="832" font-family="Inter" font-size="64" font-weight="600" text-anchor="middle" fill="#202326">P2</text>
<rect x="790" y="740" width="160" height="140" fill="#FBFBF8" stroke="#202326" stroke-width="3"/>
<text x="870" y="832" font-family="Inter" font-size="64" font-weight="600" text-anchor="middle" fill="#202326">P3</text>
<polyline points="630,420 630,740" fill="none" stroke="#E87823" stroke-width="4" stroke-linejoin="miter" marker-end="url(#arrow-orange)" marker-start="url(#arrow-orange)"/>
