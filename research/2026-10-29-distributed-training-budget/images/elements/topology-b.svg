<polyline points="370,420 370,740" fill="none" stroke="#E87823" stroke-width="4" stroke-linejoin="miter" marker-end="url(#arrow-orange)" marker-start="url(#arrow-orange)"/>
<rect x="530" y="40" width="440" height="920" fill="#FBFBF8" stroke="#202326" stroke-width="3"/>
<text x="750" y="120" font-family="Inter" font-size="60" font-weight="600" text-anchor="middle" fill="#202326">Rack 1</text>
<text x="750" y="220" font-family="Inter" font-size="60" font-weight="600" text-anchor="middle" fill="#202326">R0</text>
<text x="750" y="680" font-family="Inter" font-size="60" font-weight="600" text-anchor="middle" fill="#202326">R1</text>
