<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc">
<title id="title">Eight GPUs, two execution views</title>
<desc id="desc">A single physical two-by-four grid contains ranks 0 to 7. Tensor-parallel groups are rows of four, context-parallel groups are vertical pairs, and expert parallelism uses all eight ranks.</desc>
