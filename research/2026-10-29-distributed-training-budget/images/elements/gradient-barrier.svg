<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1100" viewBox="0 0 1000 1100" role="img" aria-labelledby="title desc">
<title id="title">The global clipping dependency chain</title>
<desc id="desc">Completed gradient buckets contribute to local tensor/context-parallel and data-parallel sums. Every required sum must finish across the whole step before one all-parameter global L2 norm. Each unique Muon and AdamW gradient contributes once, excluding duplicate TP/CP/DP copies. One scalar clips every gradient before the two optimizer paths. Both updated weights and optimizer state must be published before the next step.</desc>
<defs>
<marker id="arrow-ink" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 5 L 1 9" fill="none" stroke="#202326" stroke-width="3"/></marker>
<marker id="arrow-blue" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 5 L 1 9" fill="none" stroke="#3478BA" stroke-width="3"/></marker>
<marker id="arrow-orange" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 5 L 1 9" fill="none" stroke="#E87823" stroke-width="3"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="1100" fill="#FBFBF8"/>
<text x="500" y="78" font-family="Inter" font-size="56" font-weight="600" text-anchor="middle" fill="#202326">One global clipping barrier</text>
<polyline points="500,190 500,225" fill="none" stroke="#202326" stroke-width="4" stroke-linejoin="miter" marker-end="url(#arrow-ink)"/>
<polyline points="500,355 500,390" fill="none" stroke="#202326" stroke-width="4" stroke-linejoin="miter" marker-end="url(#arrow-ink)"/>
<polyline points="500,520 500,555" fill="none" stroke="#202326" stroke-width="4" stroke-linejoin="miter" marker-end="url(#arrow-ink)"/>
<polyline points="500,935 500,970" fill="none" stroke="#202326" stroke-width="4" stroke-linejoin="miter" marker-end="url(#arrow-ink)"/>
<polyline points="500,635 500,657 255,657 255,680" fill="none" stroke="#3478BA" stroke-width="4" stroke-linejoin="miter" marker-end="url(#arrow-blue)"/>
<polyline points="255,765 255,790 500,790" fill="none" stroke="#3478BA" stroke-width="4" stroke-linejoin="miter"/>
<polyline points="500,635 500,657 745,657 745,680" fill="none" stroke="#E87823" stroke-width="4" stroke-linejoin="miter" marker-end="url(#arrow-orange)"/>
<polyline points="745,765 745,790 500,790" fill="none" stroke="#E87823" stroke-width="4" stroke-linejoin="miter"/>
<polyline points="500,790 500,815" fill="none" stroke="#202326" stroke-width="4" stroke-linejoin="miter" marker-end="url(#arrow-ink)"/>
<rect x="80" y="110" width="840" height="80" fill="#FBFBF8" stroke="#202326" stroke-width="3"/>
<text x="500" y="165" font-family="Inter" font-size="48" font-weight="400" text-anchor="middle" fill="#202326">Completed gradient buckets</text>
<rect x="80" y="225" width="840" height="130" fill="#FBFBF8" stroke="#202326" stroke-width="3"/>
<text x="500" y="278" font-family="Inter" font-size="52" font-weight="600" text-anchor="middle" fill="#202326">All local TP/CP + DP</text>
<text x="500" y="335" font-family="Inter" font-size="52" font-weight="600" text-anchor="middle" fill="#202326">sums finish</text>
<rect x="80" y="390" width="840" height="130" fill="#FBFBF8" stroke="#202326" stroke-width="3"/>
<text x="500" y="445" font-family="Inter" font-size="52" font-weight="600" text-anchor="middle" fill="#202326">One all-parameter L2 norm</text>
<text x="500" y="502" font-family="Inter" font-size="48" font-weight="400" text-anchor="middle" fill="#202326">Count each gradient once</text>
<rect x="80" y="555" width="840" height="80" fill="#FBFBF8" stroke="#202326" stroke-width="3"/>
<text x="500" y="610" font-family="Inter" font-size="52" font-weight="600" text-anchor="middle" fill="#202326">Clip all with one scalar</text>
<rect x="60" y="680" width="390" height="85" fill="#3478BA" fill-opacity="0.06" stroke="#3478BA" stroke-width="3"/>
<text x="255" y="739" font-family="Inter" font-size="52" font-weight="600" text-anchor="middle" fill="#3478BA">Muon</text>
<rect x="550" y="680" width="390" height="85" fill="#E87823" fill-opacity="0.06" stroke="#E87823" stroke-width="3"/>
<text x="745" y="739" font-family="Inter" font-size="52" font-weight="600" text-anchor="middle" fill="#E87823">AdamW</text>
<rect x="80" y="815" width="840" height="120" fill="#FBFBF8" stroke="#202326" stroke-width="3"/>
<text x="500" y="868" font-family="Inter" font-size="52" font-weight="600" text-anchor="middle" fill="#202326">Both updates published</text>
<text x="500" y="918" font-family="Inter" font-size="48" font-weight="400" text-anchor="middle" fill="#202326">weights + optimizer state</text>
<rect x="80" y="970" width="840" height="80" fill="#FBFBF8" stroke="#202326" stroke-width="3"/>
<text x="500" y="1025" font-family="Inter" font-size="52" font-weight="600" text-anchor="middle" fill="#202326">Next step</text>
</svg>
