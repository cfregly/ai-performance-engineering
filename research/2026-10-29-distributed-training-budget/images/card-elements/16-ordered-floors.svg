<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
<title id="title">Two ordered lower bounds</title>
<desc id="desc">The declared full DP all-reduce-before-norm plan has optimistic ordered resource floors, not runtime estimates. Blue is before clipping and orange is after clipping. A 150 ms target is shown on a zero-based millisecond axis.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9" fill="none" stroke="#202326" stroke-width="2"/></marker></defs>
<rect width="1000" height="1000" fill="#FBFBF8"/>
<g font-family="Inter" font-weight="400" fill="#202326">
<text x="500" y="140" font-size="52" text-anchor="middle" fill="#202326">Two ordered lower bounds</text>
<text x="500" y="198" font-size="36" text-anchor="middle" fill="#202326">Hypothetical plan · ms per update</text>
<rect x="115" y="244" width="28" height="28" fill="#3478BA" stroke="#3478BA" stroke-width="0"/>
<text x="160" y="273" font-size="36" text-anchor="start" fill="#202326">Before clip</text>
<rect x="540" y="244" width="28" height="28" fill="#E87823" stroke="#E87823" stroke-width="0"/>
<text x="585" y="273" font-size="36" text-anchor="start" fill="#202326">After clip</text>
<line x1="140" y1="350" x2="140" y2="600" stroke="#202326" stroke-width="2"/>
<text x="140" y="645" font-size="36" text-anchor="middle" fill="#202326">0</text>
<line x1="490" y1="350" x2="490" y2="600" stroke="#202326" stroke-width="2" stroke-dasharray="10 8"/>
<text x="490" y="645" font-size="36" text-anchor="middle" fill="#202326">150</text>
<line x1="840" y1="600" x2="840" y2="612" stroke="#202326" stroke-width="2"/>
<text x="840" y="645" font-size="36" text-anchor="middle" fill="#202326">300</text>
<line x1="140" y1="600" x2="840" y2="600" stroke="#202326" stroke-width="2"/>
<text x="490" y="330" font-size="36" text-anchor="middle" fill="#202326">150 ms target</text>
<rect x="140" y="365" width="404.732" height="70" fill="#3478BA" stroke="#3478BA" stroke-width="0"/>
<rect x="544.732" y="365" width="156.736" height="70" fill="#E87823" stroke="#E87823" stroke-width="0"/>
<text x="95" y="416" font-size="52" text-anchor="start" fill="#202326">A</text>
<text x="342.366" y="416" font-size="48" text-anchor="middle" fill="#FBFBF8">173.46</text>
<text x="623.1" y="416" font-size="48" text-anchor="middle" fill="#FBFBF8">67.17</text>
<text x="719.468" y="416" font-size="52" text-anchor="start" fill="#202326">240.63</text>
<rect x="140" y="510" width="214.111" height="70" fill="#3478BA" stroke="#3478BA" stroke-width="0"/>
<rect x="354.111" y="510" width="156.736" height="70" fill="#E87823" stroke="#E87823" stroke-width="0"/>
<text x="95" y="561" font-size="52" text-anchor="start" fill="#202326">B</text>
<text x="247.055" y="561" font-size="48" text-anchor="middle" fill="#FBFBF8">91.76</text>
<text x="432.479" y="561" font-size="48" text-anchor="middle" fill="#FBFBF8">67.17</text>
<text x="528.847" y="561" font-size="52" text-anchor="start" fill="#202326">158.93</text>
<text x="500" y="703" font-size="36" text-anchor="middle" fill="#202326">Declared full DP all-reduce before norm</text>
<text x="500" y="743" font-size="36" text-anchor="middle" fill="#202326">FP32 Muon, one attention owner</text>
<text x="500" y="783" font-size="36" text-anchor="middle" fill="#202326">Assumed 100 TFLOP/s/GPU,</text>
<text x="500" y="823" font-size="36" text-anchor="middle" fill="#202326">rack 80 GB/s / node 40 GB/s</text>
<text x="500" y="863" font-size="36" text-anchor="middle" fill="#202326">Each direction. Balanced routing.</text>
<text x="500" y="903" font-size="36" text-anchor="middle" fill="#202326">Lower bounds, not runtimes.</text>
</g></svg>
