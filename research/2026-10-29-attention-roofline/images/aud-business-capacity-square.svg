<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><title>business capacity</title>
<style>@font-face{font-family:Inter;src:url("attention-scenes/Inter.ttf") format("truetype");font-weight:100 900}</style>
<rect width="1080" height="1080" fill="#FBFBF8"/>
<text x="72" y="112" font-family="Inter" font-size="60" font-weight="700" text-anchor="start" fill="#202326">Screen the design</text>
<text x="72" y="188" font-family="Inter" font-size="60" font-weight="700" text-anchor="start" fill="#202326">before building</text>
<g data-node-id="decision"><polygon points="540,235 840,375 540,515 240,375" fill="#FBFBF8" stroke="#202326" stroke-width="4"/></g>
<text x="540" y="393" font-family="Inter" font-size="48" font-weight="600" text-anchor="middle" fill="#202326">Floor ≤ target?</text>
<g data-node-id="fail-outcome">
<rect x="72" y="630" width="256" height="280" fill="#FBFBF8" stroke="#202326" stroke-width="3" />
</g>
<g data-node-id="pass-outcome">
<rect x="728" y="630" width="304" height="280" fill="#FBFBF8" stroke="#202326" stroke-width="3" />
</g>
<g data-edge="fail-end" data-source="decision" data-target="fail-outcome">
<line x1="224" y1="375" x2="200" y2="375" stroke="#E87823" stroke-width="5" />
<line x1="200" y1="375" x2="200" y2="610" stroke="#E87823" stroke-width="5" />
<line x1="189.0" y1="592.0" x2="200" y2="610" stroke="#E87823" stroke-width="5" />
<line x1="211.0" y1="592.0" x2="200" y2="610" stroke="#E87823" stroke-width="5" />
</g>
<g data-edge="pass-end" data-source="decision" data-target="pass-outcome">
<line x1="856" y1="375" x2="880" y2="375" stroke="#3478BA" stroke-width="5" />
<line x1="880" y1="375" x2="880" y2="610" stroke="#3478BA" stroke-width="5" />
<line x1="869.0" y1="592.0" x2="880" y2="610" stroke="#3478BA" stroke-width="5" />
<line x1="891.0" y1="592.0" x2="880" y2="610" stroke="#3478BA" stroke-width="5" />
</g>
<text x="200" y="700" font-family="Inter" font-size="48" font-weight="600" text-anchor="middle" fill="#E87823">NO</text>
<text x="200" y="790" font-family="Inter" font-size="48" font-weight="600" text-anchor="middle" fill="#E87823">Reject</text>
<text x="200" y="865" font-family="Inter" font-size="48" font-weight="600" text-anchor="middle" fill="#E87823">design</text>
<text x="880" y="700" font-family="Inter" font-size="48" font-weight="600" text-anchor="middle" fill="#3478BA">YES</text>
<text x="880" y="790" font-family="Inter" font-size="48" font-weight="600" text-anchor="middle" fill="#3478BA">Implement</text>
<text x="880" y="865" font-family="Inter" font-size="48" font-weight="600" text-anchor="middle" fill="#3478BA">+ measure</text>
<text x="72" y="1000" font-family="Inter" font-size="48" font-weight="400" text-anchor="start" fill="#202326">Passing is no runtime guarantee.</text>
</svg>
