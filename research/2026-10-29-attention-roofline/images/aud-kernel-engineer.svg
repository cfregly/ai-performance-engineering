<text x="80" y="320" font-family="Inter" font-size="64" font-weight="600" text-anchor="start" fill="#202326">Buffer A</text>
<text x="80" y="470" font-family="Inter" font-size="64" font-weight="600" text-anchor="start" fill="#202326">Buffer B</text>
