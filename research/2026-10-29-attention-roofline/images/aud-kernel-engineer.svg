<text x="370" y="660" font-family="Inter" font-size="64" font-weight="500" text-anchor="start" fill="#202326">Time → (qualitative)</text>
<text x="80" y="770" font-family="Inter" font-size="64" font-weight="400" text-anchor="start" fill="#202326">In the overlap, count A + B.</text>
<text x="80" y="850" font-family="Inter" font-size="64" font-weight="400" text-anchor="start" fill="#202326">Reuse storage only after its last reader.</text>
