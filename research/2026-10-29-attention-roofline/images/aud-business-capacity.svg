<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>business capacity</title>
<style>@font-face{font-family:Inter;src:url("attention-scenes/Inter.ttf") format("truetype");font-weight:100 900}</style>
<rect width="1600" height="900" fill="#FBFBF8"/>
<text x="80" y="112" font-family="Inter" font-size="76" font-weight="700" text-anchor="start" fill="#202326">Screen the design before building</text>
<g data-node-id="decision"><polygon points="800,150 1240,270 800,390 360,270" fill="#FBFBF8" stroke="#202326" stroke-width="4"/></g>
<text x="800" y="292" font-family="Inter" font-size="64" font-weight="600" text-anchor="middle" fill="#202326">Floor ≤ target?</text>
<g data-node-id="fail-outcome">
<rect x="80" y="470" width="340" height="280" fill="#FBFBF8" stroke="#202326" stroke-width="3" />
</g>
<g data-node-id="pass-outcome">
<rect x="1150" y="470" width="400" height="280" fill="#FBFBF8" stroke="#202326" stroke-width="3" />
</g>
<g data-edge="fail-end" data-source="decision" data-target="fail-outcome">
<line x1="344" y1="270" x2="250" y2="270" stroke="#E87823" stroke-width="5" />
<line x1="250" y1="270" x2="250" y2="450" stroke="#E87823" stroke-width="5" />
<line x1="239.0" y1="432.0" x2="250" y2="450" stroke="#E87823" stroke-width="5" />
<line x1="261.0" y1="432.0" x2="250" y2="450" stroke="#E87823" stroke-width="5" />
</g>
<g data-edge="pass-end" data-source="decision" data-target="pass-outcome">
<line x1="1256" y1="270" x2="1350" y2="270" stroke="#3478BA" stroke-width="5" />
<line x1="1350" y1="270" x2="1350" y2="450" stroke="#3478BA" stroke-width="5" />
<line x1="1339.0" y1="432.0" x2="1350" y2="450" stroke="#3478BA" stroke-width="5" />
<line x1="1361.0" y1="432.0" x2="1350" y2="450" stroke="#3478BA" stroke-width="5" />
</g>
<text x="250" y="540" font-family="Inter" font-size="64" font-weight="600" text-anchor="middle" fill="#E87823">NO</text>
<text x="250" y="620" font-family="Inter" font-size="64" font-weight="600" text-anchor="middle" fill="#E87823">Reject</text>
<text x="250" y="700" font-family="Inter" font-size="64" font-weight="600" text-anchor="middle" fill="#E87823">design</text>
<text x="1350" y="540" font-family="Inter" font-size="64" font-weight="600" text-anchor="middle" fill="#3478BA">YES</text>
<text x="1350" y="620" font-family="Inter" font-size="64" font-weight="600" text-anchor="middle" fill="#3478BA">Implement</text>
<text x="1350" y="700" font-family="Inter" font-size="64" font-weight="600" text-anchor="middle" fill="#3478BA">+ measure</text>
<text x="80" y="830" font-family="Inter" font-size="64" font-weight="400" text-anchor="start" fill="#202326">Passing is no runtime guarantee.</text>
</svg>
