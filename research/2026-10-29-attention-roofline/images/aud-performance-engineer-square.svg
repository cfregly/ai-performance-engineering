<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><title>performance engineer</title>
<style>@font-face{font-family:Inter;src:url("attention-scenes/Inter.ttf") format("truetype");font-weight:100 900}</style>
<rect width="1080" height="1080" fill="#FBFBF8"/>
<text x="72" y="112" font-family="Inter" font-size="60" font-weight="700" text-anchor="start" fill="#202326">Check each resource</text>
<text x="72" y="188" font-family="Inter" font-size="60" font-weight="700" text-anchor="start" fill="#202326">separately</text>
<text x="72" y="345" font-family="Inter" font-size="48" font-weight="600" text-anchor="start" fill="#202326">Compute floor</text>
<text x="72" y="430" font-family="Inter" font-size="48" font-weight="500" text-anchor="start" fill="#E87823">Work ÷ compute rate</text>
<text x="72" y="590" font-family="Inter" font-size="48" font-weight="600" text-anchor="start" fill="#202326">Transfer floor</text>
<text x="72" y="675" font-family="Inter" font-size="48" font-weight="500" text-anchor="start" fill="#E87823">Bytes ÷ bandwidth</text>
<text x="72" y="850" font-family="Inter" font-size="48" font-weight="400" text-anchor="start" fill="#202326">Do not add overlapping floors.</text>
<text x="72" y="935" font-family="Inter" font-size="48" font-weight="400" text-anchor="start" fill="#202326">Dependencies may make</text>
<text x="72" y="1005" font-family="Inter" font-size="48" font-weight="400" text-anchor="start" fill="#202326">real time longer than both.</text>
</svg>
