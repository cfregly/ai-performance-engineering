<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Scratch traffic</title>
<style>@font-face{font-family:Inter;src:url("attention-scenes/Inter.ttf") format("truetype");font-weight:100 900}</style>
<rect width="1600" height="900" fill="#FBFBF8"/>
<text x="80" y="112" font-family="Inter" font-size="76" font-weight="700" text-anchor="start" fill="#202326">Write now. Read later.</text>
<rect x="80" y="300" width="360" height="225" fill="#FBFBF8" stroke="#202326" stroke-width="3" />
<text x="260" y="390" font-family="Inter" font-size="64" font-weight="600" text-anchor="middle" fill="#202326">Producers</text>
<text x="260" y="475" font-family="Inter" font-size="64" font-weight="600" text-anchor="middle" fill="#202326">finish</text>
<rect x="620" y="300" width="360" height="225" fill="#FBFBF8" stroke="#202326" stroke-width="3" />
<text x="800" y="390" font-family="Inter" font-size="64" font-weight="600" text-anchor="middle" fill="#202326">Scratch</text>
<text x="800" y="475" font-family="Inter" font-size="64" font-weight="600" text-anchor="middle" fill="#202326">in HBM</text>
<rect x="1160" y="300" width="360" height="225" fill="#FBFBF8" stroke="#202326" stroke-width="3" />
<text x="1340" y="390" font-family="Inter" font-size="64" font-weight="600" text-anchor="middle" fill="#202326">Reducer</text>
<text x="1340" y="475" font-family="Inter" font-size="64" font-weight="600" text-anchor="middle" fill="#202326">combines</text>
<g data-edge="0" data-source="" data-target="">
<line x1="460" y1="410" x2="600" y2="410" stroke="#3478BA" stroke-width="5" />
<line x1="582.0" y1="421.0" x2="600" y2="410" stroke="#3478BA" stroke-width="5" />
<line x1="582.0" y1="399.0" x2="600" y2="410" stroke="#3478BA" stroke-width="5" />
</g>
<g data-edge="1" data-source="" data-target="">
<line x1="1000" y1="410" x2="1140" y2="410" stroke="#E87823" stroke-width="5" />
<line x1="1122.0" y1="421.0" x2="1140" y2="410" stroke="#E87823" stroke-width="5" />
<line x1="1122.0" y1="399.0" x2="1140" y2="410" stroke="#E87823" stroke-width="5" />
</g>
<text x="80" y="675" font-family="Inter" font-size="64" font-weight="400" text-anchor="start" fill="#202326">Write results, then read them back.</text>
<text x="80" y="790" font-family="Inter" font-size="64" font-weight="400" text-anchor="start" fill="#202326">Smaller batches need a different schedule.</text>
</svg>
