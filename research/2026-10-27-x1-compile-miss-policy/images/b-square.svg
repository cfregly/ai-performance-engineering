<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
<rect width="100%" height="100%" fill="#FBFBF8"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="context-stroke" stroke-width="2"/></marker></defs>
<text x="70" y="95" font-family="Bradley Hand" font-size="57" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="70" dy="0">Same calls. Different outcomes.</tspan>
</text>
<text x="72" y="153" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="72" dy="0">Example: warmup cached A, but not B</tspan>
</text>
<path d="M74 183 Q330 178 655 185" fill="none" stroke="#202326" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="95" y="280" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="95" dy="0">Input</tspan>
</text>
<ellipse cx="410" cy="270" rx="50" ry="49.0" fill="#FBFBF8" stroke="#3478BA" stroke-width="5"/>
<text x="410" y="286" font-family="Arial, Helvetica, sans-serif" font-size="45" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="410" dy="0">A</tspan>
</text>
<ellipse cx="565" cy="270" rx="50" ry="49.0" fill="#FBFBF8" stroke="#E87823" stroke-width="5"/>
<text x="565" y="286" font-family="Arial, Helvetica, sans-serif" font-size="45" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="565" dy="0">B</tspan>
</text>
<ellipse cx="720" cy="270" rx="50" ry="49.0" fill="#FBFBF8" stroke="#3478BA" stroke-width="5"/>
<text x="720" y="286" font-family="Arial, Helvetica, sans-serif" font-size="45" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="720" dy="0">A</tspan>
</text>
<ellipse cx="875" cy="270" rx="50" ry="49.0" fill="#FBFBF8" stroke="#E87823" stroke-width="5"/>
<text x="875" y="286" font-family="Arial, Helvetica, sans-serif" font-size="45" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="875" dy="0">B</tspan>
</text>
<text x="95" y="405" font-family="Bradley Hand" font-size="41" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="95" dy="0">Fail fast</tspan>
</text>
<path d="M98 505 Q533.0 503.0 962 505" fill="none" stroke="#202326" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="410" y="468" font-family="Arial, Helvetica, sans-serif" font-size="54" fill="#3478BA" text-anchor="middle" font-weight="bold">
<tspan x="410" dy="0">C</tspan>
</text>
<text x="565" y="468" font-family="Arial, Helvetica, sans-serif" font-size="54" fill="#E87823" text-anchor="middle" font-weight="bold">
<tspan x="565" dy="0">R</tspan>
</text>
<text x="720" y="468" font-family="Arial, Helvetica, sans-serif" font-size="54" fill="#3478BA" text-anchor="middle" font-weight="bold">
<tspan x="720" dy="0">C</tspan>
</text>
<text x="875" y="468" font-family="Arial, Helvetica, sans-serif" font-size="54" fill="#E87823" text-anchor="middle" font-weight="bold">
<tspan x="875" dy="0">R</tspan>
</text>
<text x="98" y="561" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="98" dy="0">2 compiled + 2 rejected</tspan>
</text>
<text x="95" y="623" font-family="Bradley Hand" font-size="41" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="95" dy="0">Eager fallback</tspan>
</text>
<path d="M98 723 Q533.0 721.0 962 723" fill="none" stroke="#202326" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="410" y="686" font-family="Arial, Helvetica, sans-serif" font-size="54" fill="#3478BA" text-anchor="middle" font-weight="bold">
<tspan x="410" dy="0">C</tspan>
</text>
<text x="565" y="686" font-family="Arial, Helvetica, sans-serif" font-size="54" fill="#E87823" text-anchor="middle" font-weight="bold">
<tspan x="565" dy="0">E</tspan>
</text>
<text x="720" y="686" font-family="Arial, Helvetica, sans-serif" font-size="54" fill="#3478BA" text-anchor="middle" font-weight="bold">
<tspan x="720" dy="0">C</tspan>
</text>
<text x="875" y="686" font-family="Arial, Helvetica, sans-serif" font-size="54" fill="#E87823" text-anchor="middle" font-weight="bold">
<tspan x="875" dy="0">E</tspan>
</text>
<text x="98" y="779" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="98" dy="0">2 compiled + 2 eager</tspan>
</text>
<text x="95" y="895" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="95" dy="0">C = compiled    R = rejected</tspan>
<tspan x="95" dy="36.6">E = eager. No B artifact is added</tspan>
</text>
<text x="72" y="1032" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="72" dy="0">Rejected calls are caught so the example continues</tspan>
</text>
</svg>