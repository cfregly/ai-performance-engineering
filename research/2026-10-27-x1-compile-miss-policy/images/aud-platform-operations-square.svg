<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
<rect width="100%" height="100%" fill="#FBFBF8"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="context-stroke" stroke-width="2"/></marker></defs>
<text x="70" y="95" font-family="Bradley Hand" font-size="57" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="70" dy="0">Plan for unexpected inputs</tspan>
</text>
<text x="72" y="153" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="72" dy="0">A route policy belongs in the operating plan</tspan>
</text>
<path d="M74 183 Q330 178 655 185" fill="none" stroke="#202326" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="95" y="252" width="890" height="155" rx="22" fill="#EDF4F9" stroke="#3478BA" stroke-width="4"/>
<path d="M109 255 Q504.40000000000003 250 969 255" fill="none" stroke="#3478BA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="540" y="313" font-family="Arial, Helvetica, sans-serif" font-size="37" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="540" dy="0">Before use: representative warmup</tspan>
<tspan x="540" dy="45.14">Then apply the chosen policy</tspan>
</text>
<text x="95" y="498" font-family="Bradley Hand" font-size="46" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="95" dy="0">On each call</tspan>
</text>
<ellipse cx="128" cy="582" rx="20" ry="19.6" fill="#FBFBF8" stroke="#3478BA" stroke-width="5"/>
<text x="190" y="595" font-family="Arial, Helvetica, sans-serif" font-size="37" fill="#3478BA" text-anchor="start" font-weight="normal">
<tspan x="190" dy="0">Match → compiled</tspan>
</text>
<ellipse cx="128" cy="729" rx="20" ry="19.6" fill="#FBFBF8" stroke="#E87823" stroke-width="5"/>
<text x="190" y="742" font-family="Arial, Helvetica, sans-serif" font-size="37" fill="#E87823" text-anchor="start" font-weight="normal">
<tspan x="190" dy="0">Miss → reject + investigate</tspan>
</text>
<ellipse cx="128" cy="872" rx="20" ry="19.6" fill="#FBFBF8" stroke="#E87823" stroke-width="5"/>
<text x="190" y="885" font-family="Arial, Helvetica, sans-serif" font-size="37" fill="#E87823" text-anchor="start" font-weight="normal">
<tspan x="190" dy="0">or miss → eager + record</tspan>
</text>
<text x="72" y="1032" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="72" dy="0">Choose one miss behavior</tspan>
</text>
</svg>