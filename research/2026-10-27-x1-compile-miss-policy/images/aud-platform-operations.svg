<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="100%" height="100%" fill="#FBFBF8"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="context-stroke" stroke-width="2"/></marker></defs>
<text x="95" y="105" font-family="Bradley Hand" font-size="70" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="95" dy="0">Decide what an unexpected input does</tspan>
</text>
<text x="98" y="171" font-family="Arial, Helvetica, sans-serif" font-size="38" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="98" dy="0">A route policy belongs in the operating plan</tspan>
</text>
<path d="M98 203 Q420 196 825 205" fill="none" stroke="#202326" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="105" y="302" font-family="Bradley Hand" font-size="44" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="105" dy="0">Before use</tspan>
</text>
<text x="650" y="302" font-family="Bradley Hand" font-size="44" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="650" dy="0">On each call</tspan>
</text>
<rect x="105" y="355" width="410" height="300" rx="22" fill="#FBFBF8" stroke="#202326" stroke-width="4"/>
<path d="M119 358 Q293.6 353 499 358" fill="none" stroke="#202326" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="310" y="435" font-family="Arial, Helvetica, sans-serif" font-size="44" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="310" dy="0">Warm up</tspan>
<tspan x="310" dy="53.68">representative</tspan>
<tspan x="310" dy="53.68">inputs</tspan>
</text>
<path d="M545 495 Q585.5 493.0 620 495" fill="none" stroke="#202326" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<ellipse cx="675" cy="379" rx="22" ry="21.56" fill="#FBFBF8" stroke="#3478BA" stroke-width="5"/>
<text x="735" y="395" font-family="Arial, Helvetica, sans-serif" font-size="42" fill="#3478BA" text-anchor="start" font-weight="normal">
<tspan x="735" dy="0">Match → compiled</tspan>
</text>
<ellipse cx="675" cy="508" rx="22" ry="21.56" fill="#FBFBF8" stroke="#E87823" stroke-width="5"/>
<text x="735" y="524" font-family="Arial, Helvetica, sans-serif" font-size="42" fill="#E87823" text-anchor="start" font-weight="normal">
<tspan x="735" dy="0">Miss → reject + investigate</tspan>
</text>
<ellipse cx="675" cy="637" rx="22" ry="21.56" fill="#FBFBF8" stroke="#E87823" stroke-width="5"/>
<text x="735" y="653" font-family="Arial, Helvetica, sans-serif" font-size="42" fill="#E87823" text-anchor="start" font-weight="normal">
<tspan x="735" dy="0">or miss → eager + record</tspan>
</text>
<text x="98" y="852" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="98" dy="0">ILLUSTRATIVE  ·  Choose one miss behavior; record the actual route</tspan>
</text>
</svg>