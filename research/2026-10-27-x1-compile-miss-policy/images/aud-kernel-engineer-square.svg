<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
<rect width="100%" height="100%" fill="#FBFBF8"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="context-stroke" stroke-width="2"/></marker></defs>
<text x="70" y="95" font-family="Bradley Hand" font-size="57" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="70" dy="0">Routing happens before kernels</tspan>
</text>
<text x="72" y="153" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="72" dy="0">fullgraph=True example; no captured trace</tspan>
</text>
<path d="M74 183 Q330 178 655 185" fill="none" stroke="#202326" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="95" y="270" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="95" dy="0">HOST ROUTING</tspan>
</text>
<rect x="95" y="309" width="890" height="155" rx="22" fill="#FBFBF8" stroke="#202326" stroke-width="4"/>
<path d="M109 312 Q504.40000000000003 307 969 312" fill="none" stroke="#202326" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="540" y="371" font-family="Arial, Helvetica, sans-serif" font-size="39" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="540" dy="0">Input → guard check</tspan>
<tspan x="540" dy="47.58">Valid artifact or cache miss?</tspan>
</text>
<path d="M310 495 Q313.0 510.5 310 530" fill="none" stroke="#3478BA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="310" y="575" font-family="Arial, Helvetica, sans-serif" font-size="37" fill="#3478BA" text-anchor="middle" font-weight="normal">
<tspan x="310" dy="0">Compiled</tspan>
<tspan x="310" dy="45.14">launch</tspan>
</text>
<path d="M310 650 Q313.0 670.5 310 695" fill="none" stroke="#3478BA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M770 495 Q773.0 510.5 770 530" fill="none" stroke="#E87823" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="770" y="575" font-family="Arial, Helvetica, sans-serif" font-size="37" fill="#E87823" text-anchor="middle" font-weight="normal">
<tspan x="770" dy="0">Eager</tspan>
<tspan x="770" dy="45.14">operations</tspan>
</text>
<path d="M770 650 Q773.0 670.5 770 695" fill="none" stroke="#E87823" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="95" y="738" width="890" height="170" rx="22" fill="#FBFBF8" stroke="#202326" stroke-width="4"/>
<path d="M109 741 Q504.40000000000003 736 969 741" fill="none" stroke="#202326" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="540" y="810" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="540" dy="0">GPU kernels</tspan>
<tspan x="540" dy="48.8">No timing is implied</tspan>
</text>
<text x="540" y="942" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="540" dy="0">With fullgraph=True,</tspan>
