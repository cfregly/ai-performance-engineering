<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="100%" height="100%" fill="#FBFBF8"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="context-stroke" stroke-width="2"/></marker></defs>
<text x="95" y="105" font-family="Bradley Hand" font-size="70" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="95" dy="0">Warm up. Then choose the boundary.</tspan>
</text>
<text x="98" y="171" font-family="Arial, Helvetica, sans-serif" font-size="38" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="98" dy="0">Keep cache coverage and miss behavior separate</tspan>
</text>
<path d="M98 203 Q420 196 825 205" fill="none" stroke="#202326" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="105" y="280" width="580" height="325" rx="22" fill="#EDF4F9" stroke="#3478BA" stroke-width="4"/>
<path d="M119 283 Q371.8 278 669 283" fill="none" stroke="#3478BA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="145" y="355" font-family="Bradley Hand" font-size="51" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="145" dy="0">1   Warmup coverage</tspan>
</text>
<text x="145" y="440" font-family="Arial, Helvetica, sans-serif" font-size="44" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="145" dy="0">Expected inputs</tspan>
<tspan x="145" dy="53.68">→ valid cached artifacts</tspan>
</text>
<path d="M728 445 Q794.5 443.0 855 445" fill="none" stroke="#202326" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="900" y="280" width="590" height="325" rx="22" fill="#FCF0E6" stroke="#E87823" stroke-width="4"/>
<path d="M914 283 Q1171.4 278 1474 283" fill="none" stroke="#E87823" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="945" y="355" font-family="Bradley Hand" font-size="51" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="945" dy="0">2   Miss policy</tspan>
</text>
<text x="945" y="440" font-family="Arial, Helvetica, sans-serif" font-size="43" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="945" dy="0">Raise on a miss</tspan>
<tspan x="945" dy="52.46">or run eagerly on a miss</tspan>
</text>
<text x="800" y="723" font-family="Arial, Helvetica, sans-serif" font-size="44" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="800" dy="0">Valid cache hits continue to use compiled artifacts</tspan>
</text>
<text x="98" y="852" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="98" dy="0">Eager fallback runs without recompiling</tspan>
</text>
</svg>