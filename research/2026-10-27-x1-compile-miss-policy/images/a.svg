<tspan x="1297" dy="57.339999999999996">Run eagerly</tspan>
</text>
<text x="800" y="774" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="800" dy="0">Fallback runs the call without recompiling</tspan>
</text>
</svg>