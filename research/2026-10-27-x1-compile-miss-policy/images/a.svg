</text>
<path d="M98 203 Q420 196 825 205" fill="none" stroke="#202326" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="100" y="260" width="1400" height="145" rx="22" fill="#EDF4F9" stroke="#3478BA" stroke-width="4"/>
<path d="M114 263 Q744.0 258 1484 263" fill="none" stroke="#3478BA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="145" y="345" font-family="Arial, Helvetica, sans-serif" font-size="55" fill="#3478BA" text-anchor="start" font-weight="normal">
<tspan x="145" dy="0">Valid cached artifact</tspan>
</text>
<path d="M745 332 Q845.5 330.0 940 332" fill="none" stroke="#3478BA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1010" y="350" font-family="Arial, Helvetica, sans-serif" font-size="57" fill="#3478BA" text-anchor="start" font-weight="normal">
<tspan x="1010" dy="0">Run compiled</tspan>
</text>
<text x="100" y="503" font-family="Bradley Hand" font-size="54" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="100" dy="0">No match?</tspan>
</text>
<text x="100" y="560" font-family="Arial, Helvetica, sans-serif" font-size="37" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="100" dy="0">Choose one</tspan>
</text>
<path d="M410 525 Q473.0 523.0 530 525" fill="none" stroke="#E87823" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="575" y="470" width="405" height="224" rx="22" fill="#FCF0E6" stroke="#E87823" stroke-width="4"/>
<path d="M589 473 Q761.3 468 964 473" fill="none" stroke="#E87823" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1095" y="470" width="405" height="224" rx="22" fill="#FCF0E6" stroke="#E87823" stroke-width="4"/>
<path d="M1109 473 Q1281.3 468 1484 473" fill="none" stroke="#E87823" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="777" y="546" font-family="Arial, Helvetica, sans-serif" font-size="48" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="777" dy="0">Fail fast</tspan>
<tspan x="777" dy="58.56">Raise an error</tspan>
</text>
<text x="1035" y="591" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="1035" dy="0">or</tspan>
</text>
<text x="1297" y="546" font-family="Arial, Helvetica, sans-serif" font-size="47" fill="#202326" text-anchor="middle" font-weight="normal">
