<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="100%" height="100%" fill="#FBFBF8"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="context-stroke" stroke-width="2"/></marker></defs>
<text x="95" y="105" font-family="Bradley Hand" font-size="70" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="95" dy="0">Routing comes before kernel execution</tspan>
</text>
<text x="98" y="171" font-family="Arial, Helvetica, sans-serif" font-size="38" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="98" dy="0">With fullgraph=True</tspan>
</text>
<path d="M98 203 Q420 196 825 205" fill="none" stroke="#202326" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="100" y="270" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="100" dy="0">HOST ROUTING</tspan>
</text>
<rect x="100" y="310" width="600" height="320" rx="22" fill="#FBFBF8" stroke="#202326" stroke-width="4"/>
<path d="M114 313 Q376.0 308 684 313" fill="none" stroke="#202326" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="145" y="380" font-family="Bradley Hand" font-size="50" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="145" dy="0">Input → guard check</tspan>
</text>
<text x="145" y="464" font-family="Arial, Helvetica, sans-serif" font-size="41" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="145" dy="0">Valid artifact?</tspan>
<tspan x="145" dy="50.019999999999996">Miss: raise or run eagerly</tspan>
</text>
<path d="M745 365 Q895.5 363.0 1040 365" fill="none" stroke="#3478BA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="875" y="320" font-family="Arial, Helvetica, sans-serif" font-size="37" fill="#3478BA" text-anchor="middle" font-weight="normal">
<tspan x="875" dy="0">Compiled launch</tspan>
</text>
<path d="M745 585 Q895.5 583.0 1040 585" fill="none" stroke="#E87823" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="875" y="540" font-family="Arial, Helvetica, sans-serif" font-size="37" fill="#E87823" text-anchor="middle" font-weight="normal">
<tspan x="875" dy="0">Eager operations</tspan>
</text>
<rect x="1105" y="310" width="390" height="320" rx="22" fill="#FBFBF8" stroke="#202326" stroke-width="4"/>
<path d="M1119 313 Q1284.4 308 1479 313" fill="none" stroke="#202326" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1300" y="435" font-family="Bradley Hand" font-size="57" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="1300" dy="0">GPU</tspan>
<tspan x="1300" dy="69.53999999999999">kernels</tspan>
</text>
<text x="800" y="751" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="800" dy="0">With fullgraph=True, rejection stops this call</tspan>
</text>
</svg>