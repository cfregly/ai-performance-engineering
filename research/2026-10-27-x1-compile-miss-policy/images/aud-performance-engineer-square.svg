<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
<rect width="100%" height="100%" fill="#FBFBF8"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="context-stroke" stroke-width="2"/></marker></defs>
<text x="70" y="95" font-family="Bradley Hand" font-size="57" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="70" dy="0">Count each call's route</tspan>
</text>
<text x="72" y="153" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="72" dy="0">Example: A B A B. Warmup cached only A</tspan>
</text>
<path d="M74 183 Q330 178 655 185" fill="none" stroke="#202326" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<ellipse cx="540" cy="302" rx="70" ry="68.6" fill="#FBFBF8" stroke="#202326" stroke-width="5"/>
<text x="540" y="320" font-family="Arial, Helvetica, sans-serif" font-size="58" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="540" dy="0">4</tspan>
</text>
<text x="540" y="410" font-family="Arial, Helvetica, sans-serif" font-size="39" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="540" dy="0">calls</tspan>
</text>
<path d="M490 453 Q398.0 484.5 300 520" fill="none" stroke="#3478BA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M590 453 Q688.0 484.5 780 520" fill="none" stroke="#E87823" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<ellipse cx="280" cy="606" rx="70" ry="68.6" fill="#FBFBF8" stroke="#3478BA" stroke-width="5"/>
<text x="280" y="625" font-family="Arial, Helvetica, sans-serif" font-size="58" fill="#3478BA" text-anchor="middle" font-weight="normal">
<tspan x="280" dy="0">2</tspan>
</text>
<text x="280" y="723" font-family="Arial, Helvetica, sans-serif" font-size="38" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="280" dy="0">cache hits</tspan>
</text>
<ellipse cx="800" cy="606" rx="70" ry="68.6" fill="#FBFBF8" stroke="#E87823" stroke-width="5"/>
<text x="800" y="625" font-family="Arial, Helvetica, sans-serif" font-size="58" fill="#E87823" text-anchor="middle" font-weight="normal">
<tspan x="800" dy="0">2</tspan>
</text>
<text x="800" y="723" font-family="Arial, Helvetica, sans-serif" font-size="38" fill="#202326" text-anchor="middle" font-weight="normal">
<tspan x="800" dy="0">cache misses</tspan>
</text>
<text x="280" y="815" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#3478BA" text-anchor="middle" font-weight="normal">
<tspan x="280" dy="0">compiled</tspan>
</text>
<text x="800" y="815" font-family="Arial, Helvetica, sans-serif" font-size="38" fill="#E87823" text-anchor="middle" font-weight="normal">
<tspan x="800" dy="0">eager or</tspan>
<tspan x="800" dy="46.36">rejected</tspan>
</text>
<text x="72" y="1032" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#202326" text-anchor="start" font-weight="normal">
<tspan x="72" dy="0">Each call is independent. Rejected calls are caught.</tspan>
</text>
</svg>